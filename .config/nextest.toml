# cargo-nextest configuration.
#
# The motivating requirement is a PER-TEST-FUNCTION timeout in CI. Plain
# `cargo test` can only be wrapped with a per-INVOCATION wall-clock cap (GNU
# `timeout` around a whole `cargo test --test <binary>` run); a single hung
# `#[test]` inside an otherwise-fast binary either burns the whole binary's
# budget or — worse, when the binary holds many tests — never trips a useful
# cap and the failure is attributed to the binary, not the offending test.
#
# nextest runs each test function as its own process and enforces
# `slow-timeout` per test. With `terminate-after` set, a test that runs past
# the period is SIGKILLed and reported as a FAILURE naming that exact test,
# which is precisely the behavior CI needs to catch a hang.
#
# #2472: THE BOUND LIVES IN `default`, NOT IN `ci`, BECAUSE THE INVARIANT IS
# PER-ROUTE. It used to sit in `[profile.ci]`, which meant it protected exactly
# one of the ways this suite is run. Measured on nextest 0.9.140:
#
#   cargo nextest run --profile ci   90s test -> TERMINATING, named          ✓
#   cargo nextest run                90s test -> "SLOW [> 60.000s]" then PASS ✗
#   cargo test                       90s test -> no per-test notion at all    ✗
#
# nextest's built-in default carries a 60s slow PERIOD with no `terminate-after`,
# so it warns and then waits forever. That is the gap that turns a known-red
# hung test into a lost run on a dev box or an agent lane: #2472 counted 55
# tests SIGKILLed by the `ci` profile in one run — CI can NAME them precisely
# because it has this setting — while the same tests wedge indefinitely on every
# other route, taking their binary's sibling verdicts down with them (a 19-hour
# gam-sae run delivered zero of the 1466 verdicts it had already computed).
#
# Every nextest profile inherits from `default`, including its `overrides`
# (verified empirically, not assumed: a profile defining only `fail-fast` still
# terminated an over-budget test at the inherited period AND still honored an
# inherited per-test exemption). So putting the cap here bounds every route that
# uses nextest at all, and `[profile.ci]` below is unchanged in behavior — it
# inherits exactly the values it used to declare. No second number is
# introduced, and there is one place to change it.
#
# What this does NOT cover, stated plainly: plain `cargo test` has no per-test
# timeout and libtest offers no way to add one, so that route stays unbounded.
# It is a reporting gap, not a solver fix — SPEC 20 still says the underlying
# non-termination is an error to be root-caused (see #2472's cluster analysis),
# and this cap exists only so such a test fails LOUDLY and BY NAME instead of
# silently consuming a run.

[profile.default]
# Per-test wall-clock cap.
#
# Choosing the period: the slowest legitimate single `#[test]` in this suite is
# a REML/PIRLS or joint-Newton solver test on a moderately sized synthetic
# problem, plus the reference-quality tests that shell out to R/mgcv/gamlss and
# Python comparators. Those reference-comparison tests dominate the tail — a
# single one can spend a couple of minutes inside the external tool. 600s gives
# the slowest of these comfortable margin (observed worst-case single tests run
# well under 5 min) while still terminating a genuine hang (an infinite solver
# loop, a deadlock, a runaway line search) quickly enough to be useful and far
# inside the 350-min job backstop.
#
# #1393: the kill threshold is 600s, but we also want EARLY identification of
# tests that are slow-but-still-passing — those are what sum up inside a sharded
# binary and drive a partition toward its wall-clock cap, and the issue's core
# ask is to surface which per-target tests are slow before the whole target is
# at risk. `period = "300s"` emits a named "SLOW" notice the moment a test
# crosses 300s; `terminate-after = 2` then SIGKILLs it after the SECOND period
# (600s total) and fails it. So a genuine hang is still terminated at 600s and
# attributed by name, AND any test that legitimately runs 300–600s is logged by
# name as it crosses 300s — giving per-test slow attribution within each shard
# without changing the kill budget.
slow-timeout = { period = "300s", terminate-after = 2 }

[profile.ci]
# CI-only REPORTING policy. The per-test cap and its exemptions are inherited
# from `default` above; nothing here changes what gets terminated or when.
#
# Emit the live test list and final summary even on success so the CI
# forbidden-pattern grep over the captured log has the per-test context, and so
# a terminated (timed-out) test is clearly attributed by name in the output.
#
# #1393: `status-level` MUST be at least `slow`. nextest's status levels are
# cumulative in the order [none, fail, retry, slow, leak, pass, skip, all]; at
# `fail` the LIVE per-test `SLOW [> 300.000s] <binary> <test>` notice — the
# whole point of the 300s slow period inherited above — is suppressed for a test that is
# slow but still passing, so it never reaches the streamed (teed) CI log. When
# the OUTER GNU `timeout` then SIGKILLs an over-budget target before nextest's
# end-of-run summary prints, there is then NO record naming the slow drivers —
# exactly the bulk-kill-hides-the-culprit failure #1393 reports. `slow` streams
# the SLOW/TIMEOUT/TERMINATING lines as each test crosses the period, so they
# are in the log even on a bulk-kill; the post-run summary step in test.yml
# hoists them into the job output. `slow` adds only fail+retry+slow statuses
# (NOT pass), so passing-test output stays suppressed and the disk-exhaustion
# guard (success-output = "never") is unaffected.
status-level = "slow"
final-status-level = "slow"

# Do not stop the run on the first failure: CI must collect every failing test
# (including the committed bug-repro regression tests) in one pass, mirroring
# the old per-binary loop's no-fail-fast contract.
fail-fast = false

# Surface the captured stdout/stderr of failing (and timed-out) tests so the
# forbidden runtime-error-signature grep in CI can classify the failure mode.
failure-output = "immediate-final"
success-output = "never"

# #1082: the two high-frequency 2D tensor recovery probes
# (`hifreq_tensor_k8`/`hifreq_tensor_k10` in the `quality` binary) carry a
# genuinely IRREDUCIBLE compute cost: a `te(theta, h, bc=['periodic','natural'],
# k=2k+4)` fits a tensor of coefficient dimension p = kb² ≈ 400 (k8) / 576 (k10),
# whose dominant per-PIRLS-iteration cost is the dense O(p³) Cholesky of
# `XᵀWX + S_λ`. The penalty side is already fully Kronecker-diagonalized
# (so its log-det is O(p)), but the DATA Gram `XᵀWX` under a general data-
# dependent PIRLS weight W does NOT factor as `A ⊗ B`, so the data-Gram
# factorization is irreducibly dense p³. `kb` cannot be capped to shrink p
# without breaking the recovery the probes verify: `sin(k·θ)` needs ≥ k Fourier
# modes in the periodic marginal (kb ≳ 18 for k8/k10).
#
# This is a real cost split, not a perf bug, and the high-frequency recovery is
# coverage worth keeping — so rather than `#[ignore]` them (which would drop the
# coverage), give ONLY these two tests a generous per-test budget so the nightly
# run completes and asserts them instead of SIGKILLing at the default 600s. The
# `quality` binary is sharded into 8 nextest partitions in CI (#1393), so the two
# heavy tests spread across shards and each shard's summed wall-clock stays under
# the per-partition cap. Every other test keeps the default 300s/600s budget.
[[profile.default.overrides]]
filter = 'test(/hifreq_tensor_k(8|10)/)'
slow-timeout = { period = "600s", terminate-after = 4 }

# Two survival integration probes carry a per-test wall-clock that exceeds the
# default 600s SIGKILL by construction, so at the default budget nextest kills
# them BEFORE their assertion runs — turning a designed verdict into an opaque
# "TERMINATING [>600s]" with no coverage. Same remedy as the hifreq probes
# above: rather than `#[ignore]` them (which drops the coverage), give ONLY
# these two a generous budget so the run completes and ASSERTS them.
#
#   `competing_risks_cif_is_invariant_to_cause_label_permutation_1593` is a
#   gauge-invariance guard (the #1549/#1587/#1593 family) that fits the SAME
#   physical two-cause competing-risks data ~9 times — natural labelling, a
#   determinism refit, and the swapped labelling, across three seeds — each a
#   full unified competing-risks Weibull fit on n=1500. The invariant itself is
#   cheap to check; it is the summed fit wall-clock that crosses 600s, and a
#   SIGKILL mid-suite means the cross-labelling CIF agreement is never asserted.
#
#   `survival_marginal_slope_converges_with_deadline_disarmed_979` deliberately
#   DISARMS the fit's outer wall-clock deadline (raising it to 900s, hard-limit
#   1140s in the test) to prove the #979 reduced-logslope joint-Newton
#   self-certifies WITHOUT the deadline being load-bearing. That 900s internal
#   budget is, by design, far above the default 600s cap, so the probe's own
#   `secs < budget - margin` assertion can never run at the default budget. The
#   companion `survival_marginal_slope_returns_bounded_not_hang_979` (20s
#   budget) stays on the default cap and is intentionally NOT matched here.
#
# The fits these probes drive are heavy but not hung (each is bounded by its own
# deadline / iteration budget); the generous cap lets the verdict surface
# instead of a bulk kill. terminate-after = 4 (→ 2400s) still SIGKILLs a genuine
# hang far inside the 350-min job backstop, and period = 600s keeps the named
# SLOW notice so the per-test slow attribution (#1393) still flags them.
[[profile.default.overrides]]
filter = 'test(/(competing_risks_cif_is_invariant_to_cause_label_permutation_1593|survival_marginal_slope_converges_with_deadline_disarmed_979)/)'
slow-timeout = { period = "600s", terminate-after = 4 }

# ---------------------------------------------------------------------------
# Diagnostic probes get a bounded lane so they cannot occupy every runner slot.
#
# The `zz_*` / `zzz_*` tests are instrumentation, not product contracts: FD
# step-law sweeps, rail-gradient ladders, mode-geography maps. They hang off
# open investigations and several run for minutes. Measured on a full
# `gam-models --lib` run (1514 tests, 948.6s wall, `--test-threads 4`): 20 such
# probes, and at one point ALL FOUR runner slots were held by them at once
# (`zz_measure_iso_kappa_face_saturation_ladder_2425` 442.0s,
# `zz_measure_2450_rho_prior_criterion_bias_ladder` 258.4s,
# `zz_measure_iso_kappa_rail_gradient_fd_2425` 228.1s, and a 95.9s
# mode-geography probe). Product verdicts stalled ~15 minutes behind
# instrumentation no release depends on: 1.3% of the tests, 100% of the runner.
#
# `#[ignore]` is the wrong remedy — it hides probes whose whole purpose is to be
# read while their issue is open. Bounding the group keeps them running and
# keeps them off the critical path.
#
# THE WIDTH IS DERIVED, NOT PICKED. Serialized, those 20 probes sum to 1173.9s,
# MORE than the entire 948.6s run, so `max-threads = 1` would make the probes
# the critical path and the suite strictly slower. At width 2 the group's
# makespan is bounded below by `max(longest_probe, total/2)`
# `= max(442.0, 587.0) = 587.0s` — inside the same run — while at least half the
# slots stay available to product tests at all times. Width 2 is the narrowest
# lane that does not extend the run.
#
# THE FILTER IS ANCHORED ON PURPOSE. `test(~zz_)` is over-broad: it also catches
# `misc::fuzz_fit_invariants::fuzz_fit_universal_invariants` and
# `misc::identifiability_nullspace_projector_idempotence_bug::
# sparse_sum_to_zero_transform_acts_like_true_projector_under_zz_t`, both of
# which are product contracts that must keep full concurrency (verified by
# listing them). Requiring `zz` at a path-segment boundary matches the 20
# diagnostics and neither of those.
[test-groups]
diagnostic-probes = { max-threads = 2 }

[[profile.default.overrides]]
filter = 'test(/(^|::)zz/)'
test-group = 'diagnostic-probes'

# ── #2267: THE CONSUMER-CHOSEN REGRESSION SET FOR THE SAE INNER SOLVE ──────────
#
# `cargo nextest run -P sae-inner-consumers -p gam-sae --lib`
#
# WHY A PROFILE AND NOT A HABIT. A change to an accept/reject rule inside the SAE
# inner solve does not alter what any function returns for fixed inputs — it
# alters WHICH STATES FITS REACH. So the tests that notice it do not live near
# the edit; they live wherever those states are consumed: value lanes, ranking
# lanes, outer probes, rank charges, certificate gates. Selecting by proximity to
# the diff measures "it still compiles and does not obviously explode".
#
# This is not a hypothetical. #2267's one-operator polish-merit fix was landed on
# a set of ten tests chosen around the polish, 10/10 green in BOTH arms, and it
# had broken `value_lane_prices_at_shared_fixed_point_2228` — a fixture the same
# author had personally measured an hour earlier on the sibling issue. The land
# was reverted (`81a97db3b` → `6597c5ae7`). The set below is what that check
# should have been.
#
# THE SELECTOR IS MECHANICAL, so it can be re-derived rather than trusted: every
# test module that drives a fit through `penalized_quasi_laplace_criterion*` or
# `run_joint_fit_arrow_schur*`. Regenerate the module list with
#
#   grep -rl 'penalized_quasi_laplace_criterion\|run_joint_fit_arrow_schur_for_quasi_laplace' \
#     crates/gam-sae/src --include='*.rs' | grep test
#
# and widen the alternation below if it grows. `zz` diagnostics are excluded on
# the same path-segment anchor the diagnostic-probes group uses: they print, they
# do not assert, and a probe cannot regress.
#
# ⚠ THE BASELINE IS NOT GREEN. At `bbbef6ad4` on an A10 (`--test-threads=4`,
# `RAYON_NUM_THREADS=3`) the set is 58 tests, 44 pass, 12 fail. DIFF A CHANGE
# AGAINST THIS LIST, NOT AGAINST GREEN:
#
#   tests_certify_external_2266::tests::converged_native_replay_passes_zero_optimization_audit_and_perturbation_fails
#   tests_indefinite_a_refusal_2336::genuine_saddle_is_infeasible_probe_not_fatal_2336
#   tests_inner_budget_trajectory_2015::inner_gnorm_vs_budget_trajectory_2015
#   tests_outer_quasi_laplace_probe_budget_2080::ceiling_vs_pathology_outer_reml_instrument_2156
#   tests_outer_quasi_laplace_probe_budget_2080::k1_generated_seed_circle_outer_reml_does_not_livelock_2153
#   tests_outer_quasi_laplace_probe_budget_2080::profile_wide_p_criterion_cost_2080
#   tests_outer_quasi_laplace_probe_budget_2080::reactive_entry_reseeds_nonzero_k2_seed_to_strict_separated_root_2080
#   tests_outer_quasi_laplace_probe_budget_2080::small_fold_high_rank_circle_inner_solve_converges_2138
#   tests_outer_quasi_laplace_probe_budget_2080::wide_p_outer_reml_terminates_within_probe_budget_2080
#   tests_rank_charge_2101::rank_charge_dense_streaming_parity
#   tests_streaming_efs_cache_1026::streaming_cache_is_efs_dropin_for_dense_cache_1026
#   tests_tier0_primary_path_2023::tests::e1_arc_outer_search_mints_or_reports_blocker_2266
#
# Seven of those twelve are inner-solve or outer-REML CONVERGENCE tests, which is
# the finding this set exists to keep visible: the #2267/#2253/#2080 wall is the
# dominant failure mode of everything that consumes an SAE fit, not one fixture's
# problem. Note also that `genuine_saddle_is_infeasible_probe_not_fatal_2336` is
# already red — read it before building anything that relies on saddle handling.
[profile.sae-inner-consumers]
default-filter = 'package(gam-sae) and not test(/(^|::)zz/) and test(/^manifold::(sae_contract_probe_tests|tests_outer_quasi_laplace_probe_budget_2080|tests_inner_convergence_rate_2267|tests_certify_external_2266|tests_two_tier_2023|tests_tier0_primary_path_2023|tests_stall_diagnostic_2234|tests_indefinite_a_refusal_2336|tests_inner_budget_trajectory_2015|tests_rank_charge_2101|tests_streaming_efs_cache_1026)::/)'
