name: Run benchmark scenario shard
description: >-
  Stage the shared benchmark runtime, run one scenario under its own measured
  wall budget, publish a machine-readable outcome marker, and upload whatever the
  shard produced.

# #2737: this file exists because the shard body was duplicated VERBATIM between
# `bench-shard` and `bench-shard-serial` in benchmark.yml -- including the wall
# budget `case` statement, which is precisely the kind of hand-maintained list
# that goes stale in one copy and not the other. One source of truth.

inputs:
  scenario:
    description: Scenario name to run.
    required: true
  wall-budget-seconds:
    description: >-
      Per-scenario wall budget for the bench command, derived from that
      scenario's own measured history (bench/ci_wall_budgets.json) and carried
      on the matrix entry by `workflow_tasks.py build_matrix`.
    required: true
  contender-filter:
    description: Optional comma-separated contender subset; empty runs the scenario defaults.
    required: false
    default: ""
  cv-splits:
    description: Optional CV split override; empty uses the scenario default.
    required: false
    default: ""
  github-token:
    description: Token used to download the shared runtime artifact.
    required: true

runs:
  using: composite
  steps:
    - name: Download shared runtime
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        python3 .github/scripts/workflow_tasks.py download_artifacts bench-runtime bench/runtime

    - name: Install gamfit Rust extension into source tree
      shell: bash
      run: |
        set -euo pipefail
        shopt -s nullglob
        installed=0
        for so in bench/runtime/_rust*.so; do
          cp "$so" "gamfit/$(basename "$so")"
          installed=$((installed + 1))
        done
        if [ "${installed}" -eq 0 ]; then
          echo "::error title=Missing gamfit extension::No _rust*.so in bench-runtime artifact (bootstrap-runtime did not build gamfit._rust)"
          exit 1
        fi
        ls -l gamfit/_rust*.so

    - name: Run scenario shard
      shell: bash
      env:
        # Executing `python3 bench/run_suite.py` makes `bench/`, not the
        # repository root, `sys.path[0]`. Keep the source-tree `gamfit`
        # package importable alongside the staged third-party dependencies.
        PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/bench/runtime/pydeps
        R_LIBS_USER: ${{ github.workspace }}/bench/runtime/r-lib
        BENCH_GAM_BIN: ${{ github.workspace }}/bench/runtime/gam
        BENCH_SCENARIO: ${{ inputs.scenario }}
        BENCH_SHARD_TIMEOUT_SEC: ${{ inputs.wall-budget-seconds }}
        BENCH_CONTENDER_FILTER: ${{ inputs.contender-filter }}
        BENCH_CV_SPLITS: ${{ inputs.cv-splits }}
      run: |
        set -euo pipefail
        echo "== Benchmark shard diagnostics =="
        echo "pwd: $(pwd)"
        echo "scenario: ${BENCH_SCENARIO}"
        echo "python: $(command -v python3)"
        python3 --version
        echo "Rscript: $(command -v Rscript)"
        Rscript --version
        echo "BENCH_GAM_BIN=${BENCH_GAM_BIN}"
        echo "BENCH_CI_PROFILE=${BENCH_CI_PROFILE}"
        echo "BENCH_RAYON_THREADS=${BENCH_RAYON_THREADS}"
        echo "BENCH_BLAS_THREADS=${BENCH_BLAS_THREADS}"
        echo "BENCH_CMD_TIMEOUT_SEC=${BENCH_CMD_TIMEOUT_SEC}"
        echo "BENCH_SHARD_TIMEOUT_SEC=${BENCH_SHARD_TIMEOUT_SEC}"
        echo "PYTHONPATH=${PYTHONPATH}"
        echo "R_LIBS_USER=${R_LIBS_USER}"
        echo "bench/runtime tree:"
        ls -la bench/runtime || true
        ls -la bench/runtime/pydeps | sed -n '1,40p' || true
        ls -la bench/runtime/r-lib | sed -n '1,40p' || true
        echo "gam binary before chmod:"
        ls -l "${BENCH_GAM_BIN}" || true
        file "${BENCH_GAM_BIN}" || true
        chmod +x "${BENCH_GAM_BIN}" || true
        echo "gam binary after chmod:"
        ls -l "${BENCH_GAM_BIN}" || true
        file "${BENCH_GAM_BIN}" || true
        test -x "${BENCH_GAM_BIN}"
        echo "smoke-import python deps"
        python3 .github/scripts/workflow_tasks.py check_python_deps
        echo "smoke-import gamfit extension"
        python3 -c 'import gamfit, gamfit._rust; print(gamfit._rust.__file__)'
        echo "smoke-load R deps"
        Rscript -e 'library(mgcv); library(jsonlite); library(survival); library(glmnet); library(gamlss); library(gamlss.dist); library(gamboostLSS); library(mboost); library(bamlss); library(brms); cat("R deps ok\n")'
        mkdir -p bench/results-shards
        echo "running benchmark shard under a ${BENCH_SHARD_TIMEOUT_SEC}s wall budget..."
        # The bench command is wrapped in GNU `timeout` so an over-budget shard
        # FAILS (exit 124 / 137) rather than being cancelled by the GitHub
        # job-level ceiling -- a cancellation carries no exit code and would
        # erase the censored/failed distinction this step exists to record. The
        # matrix sets `timeout-minutes` above this budget for exactly that
        # reason; both numbers come from `bench/ci_wall_budgets.json`.
        #
        # #1390: this whole-shard budget is the OUTER of two caps. The inner one
        # is BENCH_BRMS_FOLD_TIMEOUT_SEC in bench/_run_suite_external.py, which
        # bounds a single brms MCMC fold so a heavy Bayesian scenario records
        # per-fold timeouts instead of having the whole shard killed after gam
        # already finished. The two must stay coupled: the outer budget has to
        # leave room for the folds the inner cap allows.
        bench_args=()
        if [ -n "${BENCH_CONTENDER_FILTER}" ]; then
          IFS=',' read -r -a selected_contenders <<< "${BENCH_CONTENDER_FILTER}"
          for contender in "${selected_contenders[@]}"; do
            bench_args+=(--contender "${contender}")
          done
        fi
        if [ -n "${BENCH_CV_SPLITS}" ]; then
          bench_args+=(--cv-splits "${BENCH_CV_SPLITS}")
        fi
        set +e
        timeout --signal=TERM --kill-after=30s "${BENCH_SHARD_TIMEOUT_SEC}s" \
          python3 bench/run_suite.py \
            --scenarios bench/scenarios.json \
            --scenario-name "${BENCH_SCENARIO}" \
            "${bench_args[@]}" \
            --out "bench/results-shards/${BENCH_SCENARIO}.json"
        rc=$?
        set -e
        # #2737: the outcome marker is written on EVERY path, including the one
        # where the shard was killed and wrote no results at all. It is the only
        # thing that lets the aggregate count a cut-short scenario as NOT
        # MEASURED instead of folding it into the failure total.
        python3 .github/scripts/workflow_tasks.py record_shard_outcome \
          --scenario "${BENCH_SCENARIO}" \
          --exit-code "${rc}" \
          --budget-seconds "${BENCH_SHARD_TIMEOUT_SEC}" \
          --out "bench/results-shards/${BENCH_SCENARIO}.outcome.json"
        if [ "${rc}" -ne 0 ]; then
          if [ "${rc}" = "124" ] || [ "${rc}" = "137" ]; then
            echo "::error title=Benchmark shard NOT MEASURED (censored)::Scenario ${BENCH_SCENARIO} was cut short at its ${BENCH_SHARD_TIMEOUT_SEC}s wall budget (exit ${rc}). It measured NOTHING: this is neither a pass nor a failure of the scenario, and the aggregate counts it as NOT MEASURED. Raise the budget in bench/ci_wall_budgets.json or make the scenario cheaper."
          else
            echo "::error title=Benchmark shard failed inside its budget::Scenario ${BENCH_SCENARIO} failed with exit ${rc} after running INSIDE its ${BENCH_SHARD_TIMEOUT_SEC}s wall budget. This is a real defect, not a budget case."
          fi
          exit 1
        fi
        echo "shard output:"
        ls -l "bench/results-shards/${BENCH_SCENARIO}.json"

    # always(): the marker for a censored or failed shard is the whole point --
    # it must outlive the step that failed, or the aggregate is back to guessing
    # from job durations.
    - name: Upload shard outcome marker
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: bench-outcome-${{ inputs.scenario }}
        path: bench/results-shards/${{ inputs.scenario }}.outcome.json
        if-no-files-found: warn

    - name: Upload shard artifact
      uses: actions/upload-artifact@v4
      with:
        name: bench-${{ inputs.scenario }}
        path: |
          bench/results-shards/${{ inputs.scenario }}.json
          bench/results-shards/figures/${{ inputs.scenario }}.png
        if-no-files-found: error
