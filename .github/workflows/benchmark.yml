name: Benchmark Suite

on:
  workflow_dispatch:
    inputs:
      scenarios:
        description: "all, or a comma-separated scenario subset"
        required: false
        default: "all"
        type: string
      contenders:
        description: "Optional comma-separated contender names; empty runs the scenario defaults"
        required: false
        default: ""
        type: string
      cv_splits:
        description: "Optional CV split override; use 1 for fast signal, empty for the scenario default"
        required: false
        default: ""
        type: string
  schedule:
    - cron: "0 4 * * *"

# #2443/#2437: a SCHEDULED run is a record of that commit's benchmark, so it is
# keyed on `github.sha` and never cancelled — a lane's `workflow_dispatch` from
# `main` would otherwise share the ref-keyed group and destroy the nightly's
# only verdict. Dispatched runs keep newest-wins semantics on their own ref.
concurrency:
  group: benchmark-suite-${{ github.event_name == 'schedule' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

permissions:
  actions: read
  contents: read

env:
  CARGO_TERM_COLOR: always
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_PYTHON_VERSION_WARNING: "1"
  R_LIBS_USER: ${{ github.workspace }}/.r-lib
  BENCH_PYTHON_VERSION: "3.12"
  BENCH_R_VERSION: "4.4.3"
  BENCH_RUNTIME_CACHE_VERSION: v3
  BENCH_BINARY_CACHE_VERSION: v1

jobs:
  prepare:
    name: Prepare benchmark matrix
    runs-on: ubuntu-latest
    outputs:
      parallel_matrix: ${{ steps.matrix.outputs.parallel_matrix }}
      parallel_count: ${{ steps.matrix.outputs.parallel_count }}
      serial_matrix: ${{ steps.matrix.outputs.serial_matrix }}
      serial_count: ${{ steps.matrix.outputs.serial_count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.BENCH_PYTHON_VERSION }}

      - name: Install Python deps for preflight
        # The two preflight steps below load bench/run_suite.py via
        # importlib, which top-level imports numpy and pandas (and pulls in
        # bench/_run_suite_*.py helpers that import the same two). Neither
        # scikit-learn nor lifelines is referenced anywhere on the
        # preflight code path now that 29a56c5 routed validation through
        # the pure-Python validate_scenario_schema dispatcher instead of
        # invoking the dataset loaders. lifelines drags in autograd-gamma,
        # an sdist-only package whose build is fragile across pip/
        # setuptools versions — installing it here just to immediately not
        # use it widens the failure surface of the matrix-prepare job for
        # no benefit.
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install numpy pandas

      - name: Preflight scenario schemas
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/workflow_tasks.py validate_schemas

      - name: Preflight geo_subpop16 simulation
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/workflow_tasks.py validate_geo_subpop

      - name: Build scenario matrix
        id: matrix
        shell: bash
        run: |
          python3 .github/scripts/workflow_tasks.py build_matrix \
            --scenarios '${{ inputs.scenarios }}'

  bootstrap-runtime:
    name: Bootstrap benchmark runtime
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # #1458: full history so build.rs author gate resolves real last editor, not HEAD

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.BENCH_PYTHON_VERSION }}

      - name: Restore shared runtime cache
        id: runtime-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            bench/runtime/pydeps
            bench/runtime/r-lib
          key: ${{ runner.os }}-bench-runtime-${{ env.BENCH_RUNTIME_CACHE_VERSION }}-${{ hashFiles('.github/actions/bench-setup/action.yml', 'bench/runtime-dependencies.txt') }}
          restore-keys: |
            ${{ runner.os }}-bench-runtime-${{ env.BENCH_RUNTIME_CACHE_VERSION }}-

      - name: Shared benchmark setup (cached)
        if: ${{ steps.runtime-cache.outputs.cache-matched-key == '' }}
        uses: ./.github/actions/bench-setup
        with:
          install-runtime-deps: "true"
          python-version: ${{ env.BENCH_PYTHON_VERSION }}
          r-version: ${{ env.BENCH_R_VERSION }}

      # `Verify staged runtime is complete` below shells out to Rscript
      # unconditionally, but `bench-setup` (the only step that installs R)
      # is gated on a cache miss. On every cache hit we therefore have to
      # bring R up ourselves; without this the verify step fails with
      # `Rscript: command not found` and the whole bootstrap job dies. The
      # r-lib toolcache makes the second install a fast no-op when
      # `bench-setup` already ran in the same job.
      - name: Set up R for runtime verification
        uses: ./.github/actions/setup-bench-r
        with:
          r-version: ${{ env.BENCH_R_VERSION }}

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Capture compiled-runtime ABI
        id: binary-abi
        shell: bash
        run: |
          set -euo pipefail
          . /etc/os-release
          python_abi="$(python3 -c 'import sys; print(f"py{sys.version_info.major}{sys.version_info.minor}")')"
          echo "key=${ID}-${VERSION_ID}-$(uname -m)-${python_abi}" >> "${GITHUB_OUTPUT}"

      # The release CLI and PyO3 extension are pure functions of the Rust
      # sources, manifests, lockfile, and pinned toolchain. Benchmark harness
      # and workflow edits must not relink the full workspace. Unlike Cargo's
      # incremental cache, this exact cache ships the finished executables.
      - name: Restore compiled benchmark runtime
        id: binary-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            bench/runtime/gam
            bench/runtime/_rust*.so
          key: ${{ runner.os }}-${{ steps.binary-abi.outputs.key }}-bench-binaries-${{ env.BENCH_BINARY_CACHE_VERSION }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml', 'Cargo.lock', 'Cargo.toml', 'pyproject.toml', 'build.rs', 'src/**/*.rs', 'src/**/*.pest', 'crates/**/Cargo.toml', 'crates/**/*.rs') }}

      - name: Stage shared runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bench/runtime/pydeps bench/runtime/r-lib
          if [ -z "${{ steps.runtime-cache.outputs.cache-matched-key }}" ]; then
            if [ ! -d "${R_LIBS_USER}" ]; then
              echo "::error title=Missing R library::R_LIBS_USER=${R_LIBS_USER} does not exist after bench-setup; cannot stage R packages for shards."
              exit 1
            fi
            # Hard-fail on copy errors: prior `|| true` here swallowed
            # partial-copy failures and shipped a runtime artifact that
            # was missing R packages (gamboostLSS, mboost, ...) into the
            # bench shards, where every scenario then died on
            # `library(gamboostLSS)`.
            cp -a "${R_LIBS_USER}/." bench/runtime/r-lib/
          fi
          # A restore-key hit is a useful seed for the expensive, unchanged R
          # library, but it is not proof that the Python package set matches
          # the current manifest. Rebuild pydeps from an empty target on every
          # non-exact hit so additions and removals are both represented.
          if [ "${{ steps.runtime-cache.outputs.cache-hit }}" != "true" ]; then
            rm -rf "${GITHUB_WORKSPACE:?}/bench/runtime/pydeps"
            mkdir -p bench/runtime/pydeps
            python3 -m pip install --upgrade pip setuptools wheel
            BENCH_PYTHON_PACKAGES="$(sed -n 's/^python-packages=//p' \
              bench/runtime-dependencies.txt)"
            if [ -z "${BENCH_PYTHON_PACKAGES}" ]; then
              echo "::error title=Missing benchmark dependencies::bench/runtime-dependencies.txt has no python-packages entry."
              exit 1
            fi
            IFS=',' read -r -a bench_python_packages <<< "${BENCH_PYTHON_PACKAGES}"
            python3 -m pip install --target bench/runtime/pydeps \
              "${bench_python_packages[@]}"
          fi

      - name: Verify staged runtime is complete
        shell: bash
        env:
          STAGED_PYDEPS: ${{ github.workspace }}/bench/runtime/pydeps
          STAGED_R_LIB: ${{ github.workspace }}/bench/runtime/r-lib
        run: |
          set -euo pipefail
          # Every imported module must resolve inside the staged artifact.
          # Merely importing against the runner's system site-packages would
          # let an incomplete cache pass here and fail later in clean shards.
          PYTHONNOUSERSITE=1 PYTHONPATH="${STAGED_PYDEPS}" python3 -S - <<'PY'
          import importlib
          import os
          from pathlib import Path

          staged = Path(os.environ["STAGED_PYDEPS"]).resolve()
          modules = (
              "numpy",
              "pandas",
              "pyarrow",
              "sklearn",
              "lifelines",
              "sksurv",
              "xgboost",
              "matplotlib",
          )
          for name in modules:
              module = importlib.import_module(name)
              origin = Path(module.__file__).resolve()
              if not origin.is_relative_to(staged):
                  raise RuntimeError(
                      f"{name} resolved outside staged pydeps: {origin}"
                  )
          print("staged Python runtime OK; all required packages loadable")
          PY
          # Run the same `library(...)` smoke check the shards run, but
          # do it here, ONCE, against the staged `bench/runtime/r-lib` so
          # a missing R package fails the bootstrap (and refuses to save
          # an incomplete cache or upload an incomplete artifact) instead
          # of fanning the failure out to every shard. Restricting
          # `.libPaths` to the staged tree (rather than just adding it
          # to the search) is important: setup-r leaves the installed
          # `/home/runner/work/_temp/Library` tree visible to this job,
          # which would mask a missing package in the staged tree.
          STAGED_R_LIB="${STAGED_R_LIB}" Rscript -e '
            staged <- Sys.getenv("STAGED_R_LIB")
            stopifnot(nzchar(staged))
            .libPaths(staged)
            required <- c("mgcv","jsonlite","survival","glmnet","gamlss",
                          "gamlss.dist","gamboostLSS","mboost","bamlss","brms")
            installed <- rownames(installed.packages(lib.loc = staged))
            cat("staged lib: ", staged, "\n",
                "staged pkgs: ", length(installed), "\n", sep = "")
            missing <- setdiff(required, installed)
            if (length(missing) > 0L) {
              stop("staged R lib is missing required packages: ",
                   paste(missing, collapse = ", "))
            }
            for (pkg in required) {
              if (!isTRUE(requireNamespace(pkg, quietly = TRUE))) {
                stop("staged R lib has unloadable package: ", pkg)
              }
            }
            cat("staged R lib OK; all required packages loadable\n")
          '

      # Dependency staging is independently valid and expensive. Persist it
      # before compiling Rust so a source-level build failure cannot discard a
      # complete Python/R runtime and force the next diagnostic run to rebuild it.
      - name: Save shared runtime cache
        if: ${{ steps.runtime-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            bench/runtime/pydeps
            bench/runtime/r-lib
          key: ${{ steps.runtime-cache.outputs.cache-primary-key }}

      - name: Build compiled benchmark runtime
        if: ${{ steps.binary-cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          # Build both benchmark entry points in one Cargo invocation. Running
          # `cargo build` for the CLI and then asking maturin to launch Cargo a
          # second time serialized two release/LTO roots and made every source
          # cache miss pay roughly twice. The PyO3 crate is already an abi3
          # `cdylib`; benchmark shards need that shared object, not a wheel.
          cargo build --release -p gam-cli -p gam-pyffi
          cp target/release/gam bench/runtime/gam
          chmod +x bench/runtime/gam
          cp target/release/libgam_pyffi.so bench/runtime/_rust.abi3.so
          cp bench/runtime/_rust.abi3.so gamfit/_rust.abi3.so
          # This step certifies the compiled artifact, not the Python facade.
          # The staged third-party environment was certified independently
          # above and is not installed into this bootstrap interpreter. Import
          # the extension through the benchmark's authoritative direct loader,
          # which deliberately avoids gamfit/__init__.py and its NumPy/Pandas
          # imports. Shards later exercise the full facade with staged pydeps.
          python3 - <<'PY'
          from pathlib import Path
          from bench._rust_loader import load_gamfit_rust_module

          rust_module = load_gamfit_rust_module(Path.cwd())
          print(rust_module.__file__)
          PY

      - name: Save compiled benchmark runtime
        if: ${{ steps.binary-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            bench/runtime/gam
            bench/runtime/_rust*.so
          key: ${{ steps.binary-cache.outputs.cache-primary-key }}

      - name: Upload shared runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: bench-runtime
          path: bench/runtime
          if-no-files-found: error

  bench-shard:
    name: Bench ${{ matrix.scenario }}
    needs:
      - prepare
      - bootstrap-runtime
    if: ${{ needs.prepare.outputs.parallel_count != '0' }}
    runs-on: ubuntu-latest
    # GH ceiling is a safety net only — the bench command is wrapped in
    # GNU `timeout` set below it so an over-budget shard produces a workflow
    # `failure` with exit 124/137 (not a `cancelled` job, which carries no exit
    # code and would erase the censored-vs-failed distinction).
    #
    # #1390: a few nightly scenarios run the brms MCMC contender (full
    # Bayesian sampling, 4 chains x 2000 iter per CV fold). On the larger
    # daily-demand panels the five serial folds alone overran the default 42m
    # budget, so the GNU `timeout` killed the whole shard (exit 124) AFTER gam
    # had finished — discarding every result with no per-fold attribution.
    #
    # #2737: both numbers are now PER SCENARIO and both come from the same
    # place. A flat 42m applied to a 110-scenario matrix cut 22 shards short and
    # reported them as ordinary failures, which buried 20 scenarios that were
    # failing well INSIDE the budget. Each matrix entry carries
    # `wall_budget_seconds` (the GNU `timeout`) and `timeout_minutes` (this
    # ceiling, always the larger), derived by `workflow_tasks.py build_matrix`
    # from that scenario's own measured history in bench/ci_wall_budgets.json.
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.prepare.outputs.parallel_matrix) }}
    env:
      BENCH_CI_PROFILE: ${{ github.event_name == 'schedule' && 'full' || 'lean' }}
      BENCH_RAYON_THREADS: "4"
      BENCH_BLAS_THREADS: "1"
      BENCH_CMD_TIMEOUT_SEC: "10800"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # #1458: full history so build.rs author gate resolves real last editor, not HEAD

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.BENCH_PYTHON_VERSION }}

      - name: Set up R
        uses: ./.github/actions/setup-bench-r
        with:
          r-version: ${{ env.BENCH_R_VERSION }}

      - name: Run scenario shard
        uses: ./.github/actions/run-bench-shard
        with:
          scenario: ${{ matrix.scenario }}
          wall-budget-seconds: ${{ matrix.wall_budget_seconds }}
          contender-filter: ${{ inputs.contenders }}
          cv-splits: ${{ inputs.cv_splits }}
          github-token: ${{ github.token }}

  bench-shard-serial:
    name: Bench ${{ matrix.scenario }} (serial)
    needs:
      - prepare
      - bootstrap-runtime
    if: ${{ needs.prepare.outputs.serial_count != '0' }}
    runs-on: ubuntu-24.04
    # GH ceiling is a safety net only — the bench command is wrapped in
    # GNU `timeout` set below it so an over-budget shard produces a workflow
    # `failure` with exit 124/137, not a `cancelled` job.
    #
    # #2737: per scenario, from bench/ci_wall_budgets.json — see `bench-shard`.
    # The flat 47m ceiling here sat BELOW several scenarios' real cost, so
    # `cirrhosis_survival` and `icu_survival_death` could only ever be censored.
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.prepare.outputs.serial_matrix) }}
    env:
      BENCH_CI_PROFILE: ${{ github.event_name == 'schedule' && 'full' || 'lean' }}
      BENCH_RAYON_THREADS: "4"
      BENCH_BLAS_THREADS: "1"
      BENCH_CMD_TIMEOUT_SEC: "10800"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # #1458: full history so build.rs author gate resolves real last editor, not HEAD

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.BENCH_PYTHON_VERSION }}

      - name: Set up R
        uses: ./.github/actions/setup-bench-r
        with:
          r-version: ${{ env.BENCH_R_VERSION }}

      - name: Run scenario shard
        uses: ./.github/actions/run-bench-shard
        with:
          scenario: ${{ matrix.scenario }}
          wall-budget-seconds: ${{ matrix.wall_budget_seconds }}
          contender-filter: ${{ inputs.contenders }}
          cv-splits: ${{ inputs.cv_splits }}
          github-token: ${{ github.token }}

  aggregate:
    permissions:
      contents: write
      actions: read
    name: Aggregate benchmark results
    needs:
      - bench-shard
      - bench-shard-serial
    # #2623: the default `needs` gate refuses as soon as ONE per-scenario leg
    # fails, and on this matrix at least one always does — so this job was
    # `skipped` on every nightly and the `fit_sec` every shard recorded was
    # read by nobody for months (gam was 130-480x mgcv on the joint-spatial
    # scenarios in silence). `!cancelled()` aggregates whatever legs did
    # succeed, while still declining to publish a cancelled run's partial
    # numbers as if they were a verdict.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.BENCH_PYTHON_VERSION }}

      - name: Checkout for figure generation
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # #1458: full history so build.rs author gate resolves real last editor, not HEAD
          # The aggregate job executes the workflow helper and a repository-local
          # publishing action. Keep its sparse dependency closure explicit: a
          # bench-only checkout makes both paths disappear before they are used.
          sparse-checkout: |
            bench
            .github/scripts/workflow_tasks.py
            .github/actions/publish-gha-results

      - name: Download all shard artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 .github/scripts/workflow_tasks.py download_artifacts bench- bench/artifacts

      # Writes `merged_rows` so the figure steps below can tell "the nightly
      # measured nothing" (every leg failed — now reachable because the job no
      # longer skips) from "the nightly measured something". Also emits the
      # gam-vs-reference fit_sec ratio table into the step summary.
      - name: Merge shard JSON outputs
        id: merge
        shell: bash
        run: |
          python3 .github/scripts/workflow_tasks.py format_results

      - name: Upload merged nightly results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-nightly
          path: bench/results.nightly.json
          if-no-files-found: error


      # Track this run's uncompressed numbers in-tree (bench/gha_results/benchmark).
      # always() so a failed or timed-out run still publishes what it measured -
      # those numbers are usually the interesting ones. Publishes nothing when the
      # run produced no results, so a bad run never blanks the last good one.
      - name: Publish results to bench/gha_results
        if: always()
        uses: ./.github/actions/publish-gha-results
        with:
          name: benchmark
          files: |
            bench/results.nightly.json
            bench/benchmark-verdict.json
      - name: Generate merged figures
        # `success() &&` is load-bearing: a step-level `if:` REPLACES the
        # implicit success() guard, so without it a failed merge step would
        # still let the figure steps run (and fail again on a file the merge
        # never wrote), burying the real error under a second one.
        if: ${{ success() && steps.merge.outputs.merged_rows != '0' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet matplotlib numpy pandas
          python3 bench/generate_figures.py bench/results.nightly.json bench/figures bench/figures.zip

      - name: Upload benchmark figures
        # `success() &&` is load-bearing: a step-level `if:` REPLACES the
        # implicit success() guard, so without it a failed merge step would
        # still let the figure steps run (and fail again on a file the merge
        # never wrote), burying the real error under a second one.
        if: ${{ success() && steps.merge.outputs.merged_rows != '0' }}
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-figures
          path: bench/figures.zip
          if-no-files-found: warn

      # #2623: the last step, so every artifact above is already published when
      # this goes red - a regression must not cost us the evidence of itself.
      # Until now the verdict was computed and written and read by nobody, which
      # is why a 130-480x matched-arm regression failed no job for months. The
      # bound is relative to the reference arm measured in the same job on the
      # same runner, so there is no absolute second-count to go stale.
      # `steps.merge.outcome` rather than `success()`: a figure-generation
      # failure must not swallow the verdict, but a run with no verdict at all
      # should surface the merge failure instead of a confusing gate error.
      - name: Enforce the matched benchmark regression gate
        if: ${{ !cancelled() && steps.merge.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/workflow_tasks.py enforce_verdict \
            ${{ github.event_name == 'schedule' && '--require-full-suite' || '' }}
