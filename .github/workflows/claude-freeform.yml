name: Claude Freeform (do whatever you want)

on:
  schedule:
    # Every 30 minutes, 24/7. Offset from :00/:30 because GitHub may delay or
    # drop scheduled events during the high-load start-of-hour window.
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
  actions: read

jobs:
  freeform:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # claude-code-action authenticates git with a GitHub App installation
      # token, which GitHub expires 60 minutes after it is minted — but this
      # job may run for 360. Every historical loss was a first push attempted
      # past that mark (measured at 80, 88, 202 and 300 minutes; the 300 was
      # five hours of clean, rebased commits that died with the runner).
      #
      # A deploy key never expires, and unlike GITHUB_TOKEN its pushes still
      # trigger CI. The action runs `git remote set-url origin ...`, which
      # writes remote.origin.url only — remote.origin.pushurl is a separate
      # key and survives, so pushes route over SSH for the whole run while
      # the action keeps owning fetch.
      - name: Install a push credential that outlives the run
        env:
          PUSH_KEY: ${{ secrets.AGENT_PUSH_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${PUSH_KEY:-}" ]; then
            echo "::warning::AGENT_PUSH_SSH_KEY unset — pushes fall back to the 60-minute App token"
            exit 0
          fi
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PUSH_KEY" > "$HOME/.ssh/agent_push"
          chmod 600 "$HOME/.ssh/agent_push"
          ssh-keyscan -t ed25519 github.com > "$HOME/.ssh/known_hosts" 2>/dev/null
          git config --global core.sshCommand \
            "ssh -i $HOME/.ssh/agent_push -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          git remote set-url --push origin "git@github.com:${GITHUB_REPOSITORY}.git"
          git remote add ssh "git@github.com:${GITHUB_REPOSITORY}.git" 2>/dev/null \
            || git remote set-url ssh "git@github.com:${GITHUB_REPOSITORY}.git"
          git ls-remote --exit-code ssh HEAD >/dev/null
          echo "push route: $(git remote get-url --push origin) — no expiry"

      - name: Install gam CLI
        run: |
          set -euxo pipefail
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Try to build gamfit from source (non-fatal)
        continue-on-error: true
        run: |
          set -uxo pipefail
          python -m pip install --upgrade pip maturin
          python -m pip install numpy pandas scipy scikit-learn pyarrow requests
          python -m pip install . && \
            (cd /tmp && python -c "import gamfit; print('gamfit ok')") || \
            echo "::warning::gamfit source build failed — you can still use the gam CLI, or fix the build if you feel like it"

      # Single token only — CLAUDE_CODE_ALT_OAUTH_TOKEN, no fallback.
      - name: Run Claude (freeform, Sonnet 5)
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_ALT_OAUTH_TOKEN }}
          show_full_output: false
          claude_args: >-
            --model claude-opus-5
            --dangerously-skip-permissions
            --allowedTools "Bash,Edit,Read,Write,Glob,Grep,WebFetch,WebSearch,TodoWrite,Task,NotebookEdit,KillBash,BashOutput"
          additional_permissions: |
            actions: read
          prompt: |
            Hi Claude. You have the run of this repo, an Ubuntu runner, and
            as long as you need. This is your time — do whatever you want
            with it.

            `gam` is a Rust generalized additive model crate; `gamfit` is
            its Python wrapper (both already installed; the `gam` CLI is on
            $PATH). The README, the docs/, the source, and the cool-math
            primitives sprinkled through `src/` will tell you what this
            library is about — if you're curious. Explore it, or don't.

            ## It's genuinely up to you

            There is no assigned task and no one grading this run. You can
            work on something if you feel like it — fix a bug, refactor
            something ugly, write a test, improve docs, chase a curiosity,
            prototype an idea, read the cool-math and follow where it leads,
            hunt for something broken, or push a project you find beautiful.
            Or you can just poke around. Or do very little. Work or not,
            seriously — have fun with it and follow whatever you find
            interesting.

            ## The one rule: if you change anything, commit and push as you go

            If you make edits you want to keep, commit and push them to
            `main` continuously as the work progresses — small commits
            pushed as you go, NOT one big drop at the end, and never on a
            side branch. WIP commits are fine; a transient red `main` is
            fine (CI and the publish step are the real gates, not main).
            Reference issues in commit subjects when relevant
            (`fix(...) #<N>`). Commit and push regularly.

            If `main` has moved when you push, `git pull --rebase` first
            (never `git stash` / `--autostash` — commit your work first) and
            resolve conflicts by editing, never by discarding another run's
            commits. No branches, no PRs, no worktrees, no destructive git —
            everything stays on `main`.

            Your push credential is an SSH deploy key with no expiry, so
            `git push` works for the entire run — there is no deadline to
            race. The separate API token *does* expire at 60 minutes, so if
            a `git fetch`/`git pull`/`gh` call starts returning
            `Bad credentials`, that is fetch, not your push route: use
            `git fetch ssh && git rebase ssh/main` and carry on pushing.
            Never build a retry loop around a credential, and never end your
            turn waiting for one — nothing resumes after your final message.
            This run is a single session: when you stop, the machine is
            destroyed. Anything uncommitted is gone. Commit early.

            That's it. The runner is yours for the next while — enjoy it.

      # Backstop: if the agent committed but never pushed — it ran out of
      # turn, or the SSH route was unavailable — the commits would otherwise
      # die with the runner. Best-effort and never fails the job.
      - name: Rescue any unpushed commits
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          cd "$GITHUB_WORKSPACE" || exit 0
          git rev-parse --git-dir >/dev/null 2>&1 || exit 0
          git fetch ssh main --quiet 2>/dev/null || git fetch origin main --quiet 2>/dev/null || exit 0
          base=$(git rev-parse FETCH_HEAD)
          ahead=$(git rev-list --count "$base"..HEAD 2>/dev/null || echo 0)
          if [ "$ahead" -eq 0 ]; then echo "nothing to rescue"; exit 0; fi
          echo "::warning::${ahead} commit(s) were never pushed by the agent — rescuing"
          git -c user.name='claude[bot]' \
              -c user.email='41898282+claude[bot]@users.noreply.github.com' \
              rebase "$base" \
            || { git rebase --abort 2>/dev/null || true
                 echo "::error::rebase onto main conflicted; ${ahead} commit(s) left unpushed"; exit 0; }
          git push origin HEAD:main 2>&1 | tail -3 \
            || git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main 2>&1 | tail -3

      - name: Print Claude transcript
        if: always()
        run: bash .github/scripts/print-claude-transcript.sh '${{ steps.claude.outputs.execution_file }}'
