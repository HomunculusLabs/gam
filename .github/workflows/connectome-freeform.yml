name: Connectome Freeform (continuous agent, memory across runs)

# The freeform agent, moved off claude-code-action and onto the Connectome
# stack so that it is ONE agent that persists rather than a fresh stranger
# every 30 minutes.
#
# What actually changes: the agent's Chronicle store (event-sourced history +
# autobiographical compression) is restored before the run and saved after it,
# so its memory is its own recollection of its own past instead of a briefing.
# Measured motivation: across 203 runs of the old workflow, every single one
# opened `MEMORY.md`, found it empty, and re-derived the same four facts; 41
# wrote notes "for future sessions" onto a disk destroyed minutes later.
#
# Auth is the Claude Code OAuth subscription token, NOT an API key —
# connectome-host passes ANTHROPIC_AUTH_TOKEN through Membrane with the
# `oauth-2025-04-20` beta (see connectome-host src/index.ts:77,852).
#
# Memory lives at refs/agent-memory/store — deliberately NOT a branch. GitHub
# only raises push events for refs/heads/* and refs/tags/*, so this ref can
# never trigger a workflow, and Chronicle's content-addressed append-only
# layout means git dedupes it perfectly across runs.

on:
  schedule:
    # Every 30 minutes, 24/7. Offset off :00/:30 because GitHub drops scheduled
    # events during the high-load start-of-hour window. Inherited from
    # claude-freeform.yml, which is now dispatch-only.
    - cron: "7,37 * * * *"
  workflow_dispatch:

# NO concurrency group, deliberately. Parallel runs of this workflow are wanted
# and must never queue or cancel each other — the fleet's throughput comes from
# many agents working main at once.
#
# That means memory has more than one writer, so the save is built to be
# contention-free rather than serialized (see "Save memory"): every run writes
# its own immutable ref, which cannot collide, and only the shared *pointer* is
# advanced best-effort. Parallel runs therefore fork their memory from a common
# ancestor and each keeps a complete lineage; nothing is ever lost or blocked.

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
  actions: read

jobs:
  freeform:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      AGENT_REPO_DIR: ${{ github.workspace }}
      MEMORY_REF: refs/agent-memory/store

    steps:
      # The `runner` context is not available in job-level `env:`, so the two
      # runner-temp paths are exported here instead. Both live OUTSIDE the
      # checkout so neither can be swept into the agent's own commits.
      - name: Resolve paths
        run: |
          set -euo pipefail
          echo "DATA_DIR=$RUNNER_TEMP/connectome-data" >> "$GITHUB_ENV"
          echo "HOST_DIR=$RUNNER_TEMP/connectome-host" >> "$GITHUB_ENV"
          echo "RUN_MARKER=$RUNNER_TEMP/connectome-run-${GITHUB_RUN_ID}.opened" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Same non-expiring push route as the other agent workflows: the App
      # token dies at 60 minutes, this job may run for 360.
      - name: Install a push credential that outlives the run
        env:
          PUSH_KEY: ${{ secrets.AGENT_PUSH_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${PUSH_KEY:-}" ]; then
            echo "::error::AGENT_PUSH_SSH_KEY unset — the agent could not push or save memory"
            exit 1
          fi
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PUSH_KEY" > "$HOME/.ssh/agent_push"
          chmod 600 "$HOME/.ssh/agent_push"
          ssh-keyscan -t ed25519 github.com > "$HOME/.ssh/known_hosts" 2>/dev/null
          git config --global core.sshCommand \
            "ssh -i $HOME/.ssh/agent_push -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          git config --global user.name 'claude[bot]'
          git config --global user.email '41898282+claude[bot]@users.noreply.github.com'
          git remote set-url --push origin "git@github.com:${GITHUB_REPOSITORY}.git"
          git remote add ssh "git@github.com:${GITHUB_REPOSITORY}.git" 2>/dev/null \
            || git remote set-url ssh "git@github.com:${GITHUB_REPOSITORY}.git"
          git ls-remote --exit-code ssh HEAD >/dev/null
          echo "push route: $(git remote get-url --push origin) — no expiry"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install gam CLI
        run: |
          set -euxo pipefail
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install connectome-host
        run: |
          set -euxo pipefail
          host_revision=03d60fe59a658275b0e7960206d79cff79d085ca
          install -d "$HOST_DIR"
          curl -fsSL "https://github.com/anima-research/connectome-host/archive/${host_revision}.tar.gz" \
            | tar -xz --strip-components=1 -C "$HOST_DIR"
          cd "$HOST_DIR"
          bun install --frozen-lockfile
          echo "connectome-host at $host_revision"

      # Restore the agent's past. Absent on the very first run, which is the
      # only run that is allowed to start as a stranger.
      - name: Restore memory
        run: |
          set -euo pipefail
          mkdir -p "$DATA_DIR"

          # --- episodic: this lineage's Chronicle store -------------------
          # Two runs that diverged from a common ancestor have two genuinely
          # different narratives and there is no honest way to merge them, so
          # a lineage is inherited whole from the shared pointer.
          if git fetch --quiet origin "+$MEMORY_REF:$MEMORY_REF" 2>/dev/null \
             && git rev-parse --verify -q "$MEMORY_REF" >/dev/null; then
            git archive "$MEMORY_REF" | tar -x -C "$DATA_DIR"
            # A lineage saved before the prune landed can still carry a LOCK
            # whose owning process died with that runner. Drop it on the way in
            # too, so an old pointer cannot wedge a new run's store open.
            find "$DATA_DIR" -name 'LOCK' -type f -delete 2>/dev/null || true
            echo "restored lineage from $(git log -1 --format='%h %ad %s' --date=iso "$MEMORY_REF")"
            echo "store: $(du -sh "$DATA_DIR" | cut -f1), $(find "$DATA_DIR" -type f | wc -l) files"
          else
            echo "::notice::no memory ref yet — this is the agent's first run"
          fi

          # --- semantic: lessons, unioned across EVERY lineage ------------
          # Lessons are id-addressed facts, so unlike a narrative their union
          # is well-defined. This is what stops a hard-won fact from being
          # stranded in a parallel lineage nobody inherits. connectome-host
          # reads the global file at $DATA_DIR/lessons.json
          # (index.ts:186 -> storePath/../.. with storePath={dataDir}/sessions/{id}).
          # One wildcard refspec fetches the whole namespace. (A per-ref list
          # built with `printf '+%s:%s\n' $a $a` is WRONG -- printf cycles its
          # format across every argument, so it pairs ref1 with ref2 and emits
          # a malformed refspec whose failure the redirect would hide, leaving
          # the union silently empty.)
          git fetch --quiet origin '+refs/agent-memory/lessons/*:refs/agent-memory/lessons/*' 2>/dev/null || true
          # `|| true`: under `set -o pipefail`, `head` closing the pipe early
          # can SIGPIPE `sort` once the namespace exceeds 300 refs, which would
          # abort this step and kill the run before the agent ever starts.
          shards=$(git for-each-ref --format='%(refname)' 'refs/agent-memory/lessons/*' 2>/dev/null | sort -t/ -k4 -rn | head -300 || true)
          if [ -n "$shards" ]; then
            echo "unioning $(printf '%s\n' "$shards" | wc -l | tr -d ' ') lesson shard(s)"
            tmp=$(mktemp -d)
            i=0
            for r in $shards; do
              i=$((i+1))
              git show "$r:lessons.json" > "$tmp/$i.json" 2>/dev/null || true
            done
            node "$AGENT_REPO_DIR/.github/connectome/merge-lessons.mjs" \
              "$DATA_DIR/lessons.json" "$tmp"/*.json || true
            rm -rf "$tmp"
          else
            echo "::notice::no lesson shards yet — nothing to union"
          fi

      - name: Run the agent
        id: agent
        env:
          # OAuth subscription token, not an API key.
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.CLAUDE_CODE_ALT_OAUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          cd "$HOST_DIR"
          bun src/index.ts "$AGENT_REPO_DIR/.github/connectome/recipe.json" \
            --headless > "$RUNNER_TEMP/host.log" 2>&1 &
          HOST_PID=$!
          echo "host pid $HOST_PID"

          driver_status=0
          CONNECTOME_HOST_PID="$HOST_PID" \
            node "$AGENT_REPO_DIR/.github/connectome/drive.mjs" || driver_status=$?

          host_status=0
          wait "$HOST_PID" || host_status=$?
          echo "=== tail of host log ==="
          tail -120 "$RUNNER_TEMP/host.log" || true

          if [ "$driver_status" -ne 0 ]; then
            echo "::error::Connectome driver failed with status $driver_status"
            exit "$driver_status"
          fi
          if [ "$host_status" -ne 0 ]; then
            echo "::error::Connectome host failed with status $host_status"
            exit "$host_status"
          fi

      # Save the agent's past even if the run failed or timed out — a crashed
      # run still lived through something.
      - name: Save memory
        if: always()
        # Reports its own failure without failing the run: a save that breaks
        # must be VISIBLE (the first cutover run reported success and saved
        # nothing), but it should not retroactively redden a run whose agent
        # worked fine.
        continue-on-error: true
        env:
          AGENT_OUTCOME: ${{ steps.agent.outcome }}
        run: |
          set -uo pipefail
          [ -d "$DATA_DIR" ] || { echo "no data dir; nothing to save"; exit 0; }
          [ -f "$RUN_MARKER" ] || {
            echo "::error::Connectome never opened the Chronicle store; refusing to persist or advance it"
            exit 1
          }

          # Persist MEMORY, not process residue. Only exact, known-transient
          # paths are pruned:
          #   ipc.sock  — a live socket, meaningless once the run ends.
          #   LOCK      — a store mutex held by a process that no longer
          #               exists; restoring it risks a stale lock blocking
          #               the next run's open.
          #   headless.log / llm-calls*.jsonl — per-run diagnostics. The
          #               llm-calls file is
          #               ~126 KB and its name carries a timestamp, so every
          #               run would add a NEW blob git cannot dedupe: ~6 MB a
          #               day at a 30-minute cadence, unbounded. The run log
          #               in Actions already holds this.
          #
          # Never glob `*.log`: Chronicle's durable event store is
          # `sessions/*/records.log`. Deleting it while retaining `state.bin`
          # creates a torn snapshot whose state offsets point past log length
          # zero — the exact corruption diagnosed in run 30188081780.
          rm -f "$DATA_DIR/ipc.sock" "$DATA_DIR/headless.log"
          find "$DATA_DIR" -name 'LOCK' -type f -delete 2>/dev/null || true
          find "$DATA_DIR" -maxdepth 1 -name 'llm-calls*.jsonl' -type f -delete 2>/dev/null || true
          size=$(du -sm "$DATA_DIR" | cut -f1)
          echo "store size: ${size} MB, $(find "$DATA_DIR" -type f | wc -l) files"
          if [ "$size" -gt 1024 ]; then
            echo "::warning::memory store is ${size} MB — consider pruning old Chronicle branches"
          fi

          # Git requires the index path not to exist yet. Put that path inside
          # a private temporary directory instead of using racy `mktemp -u`.
          index_dir=$(mktemp -d)
          idx="$index_dir/index"
          export GIT_INDEX_FILE="$idx"
          export GIT_DIR="$AGENT_REPO_DIR/.git"
          export GIT_WORK_TREE="$DATA_DIR"
          git add -A . || { echo "::error::failed to stage memory"; exit 1; }
          tree=$(git write-tree) || { echo "::error::failed to write memory tree"; exit 1; }
          parent=$(git rev-parse --verify -q "$MEMORY_REF" || true)
          msg="memory after run ${GITHUB_RUN_ID} (${GITHUB_RUN_NUMBER})"
          if [ -n "$parent" ]; then
            commit=$(git commit-tree "$tree" -p "$parent" -m "$msg")
          else
            commit=$(git commit-tree "$tree" -m "$msg")
          fi
          unset GIT_WORK_TREE GIT_INDEX_FILE
          rm -rf "$index_dir"

          # 1. This run's own lineage. The ref name contains the run id, so no
          #    concurrent run can ever contend for it and this push cannot fail
          #    for a reason another agent caused. This is what makes the memory
          #    safe WITHOUT a concurrency group.
          own="refs/agent-memory/runs/${GITHUB_RUN_ID}"
          if git push origin "$commit:$own" 2>&1 | tail -1; then
            echo "saved this run's memory at $own (${commit:0:9})"
          else
            echo "::error::could not save this run's memory lineage"
          fi

          # 2. This run's LESSONS shard. Its own ref, so parallel runs never
          #    contend; every future run unions all shards, so a fact learned
          #    in a lineage that loses the pointer race still reaches everyone.
          if [ -s "$DATA_DIR/lessons.json" ]; then
            lessons_index_dir=$(mktemp -d)
            lidx="$lessons_index_dir/index"
            if GIT_INDEX_FILE="$lidx" GIT_DIR="$AGENT_REPO_DIR/.git" GIT_WORK_TREE="$DATA_DIR" \
                 git add -- lessons.json 2>/dev/null; then
              ltree=$(GIT_INDEX_FILE="$lidx" GIT_DIR="$AGENT_REPO_DIR/.git" git write-tree)
              lcommit=$(git commit-tree "$ltree" -m "lessons from run ${GITHUB_RUN_ID}")
              count=$(node -e 'try{console.log((JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).lessons||[]).length)}catch{console.log("?")}' "$DATA_DIR/lessons.json")
              if git push origin "$lcommit:refs/agent-memory/lessons/${GITHUB_RUN_ID}" 2>&1 | tail -1; then
                echo "saved $count lesson(s) to refs/agent-memory/lessons/${GITHUB_RUN_ID}"
              else
                echo "::error::could not save lessons shard"
              fi
            fi
            rm -rf "$lessons_index_dir"
          else
            echo "no lessons.json produced this run"
          fi

          # 2b. Prune old per-run refs. At a 30-minute cadence these accrue two
          #     refs per run — ~35k/year — and every run's restore does an
          #     ls-remote across them. Safe because a lessons shard's content is
          #     folded into the store's own lessons.json by every subsequent
          #     run's restore, so a shard older than the retention window has
          #     long since been absorbed by the surviving lineage. Keeps the
          #     newest KEEP of each kind; deletion failures are ignored.
          KEEP=200
          for kind in runs lessons; do
            # newest-first by numeric run id, then skip the KEEP newest;
            # `tail -n +N` is portable where GNU `head -n -N` is not.
            stale=$(git ls-remote origin "refs/agent-memory/$kind/*" 2>/dev/null \
                    | awk '{print $2}' | sort -t/ -k4 -rn | tail -n +"$((KEEP + 1))")
            [ -z "$stale" ] && continue
            echo "pruning $(printf '%s\n' "$stale" | wc -l | tr -d ' ') old $kind ref(s)"
            printf '%s\n' "$stale" | xargs -r -n 50 git push --quiet origin --delete 2>/dev/null || true
          done

          # 3. Advance the shared pointer that the next run restores from.
          #    Contended by design: with parallel runs the last finisher wins,
          #    and a loss here costs nothing because step 1 already persisted
          #    everything. Never retried into a spin — a losing run just yields.
          #
          #    Only a run whose agent actually finished may become the pointer.
          #    Memory is inherited whole, so a lineage the producing run could
          #    not itself use is one every later run also cannot use: on 07-26
          #    a run that died on an over-budget context advanced the pointer to
          #    an 89.9 MB store, and every run after it restored that same dead
          #    state. Persisting the lineage at $own above already loses
          #    nothing — this only declines to make a dead state the default.
          if [ "${AGENT_OUTCOME:-}" != "success" ]; then
            echo "::warning::agent outcome '${AGENT_OUTCOME:-unset}' — memory kept at $own but $MEMORY_REF left where it was"
            exit 0
          fi

          for attempt in 1 2 3; do
            if git push origin "$commit:$MEMORY_REF" 2>&1 | tail -1; then
              echo "advanced $MEMORY_REF to ${commit:0:9}"
              exit 0
            fi
            git fetch --quiet origin "+$MEMORY_REF:$MEMORY_REF" || true
            newtip=$(git rev-parse --verify -q "$MEMORY_REF" || true)
            if [ -n "$newtip" ] && [ "$newtip" != "${parent:-}" ]; then
              echo "::notice::a parallel run advanced $MEMORY_REF to ${newtip:0:9} first; this run's memory is preserved at $own"
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo "::notice::did not advance the shared pointer; this run's memory is preserved at $own"

      - name: Rescue any unpushed commits
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          cd "$GITHUB_WORKSPACE" || exit 0
          git rev-parse --git-dir >/dev/null 2>&1 || exit 0
          git fetch ssh main --quiet 2>/dev/null || git fetch origin main --quiet 2>/dev/null || exit 0
          base=$(git rev-parse FETCH_HEAD)
          ahead=$(git rev-list --count "$base"..HEAD 2>/dev/null || echo 0)
          if [ "$ahead" -eq 0 ]; then echo "nothing to rescue"; exit 0; fi
          echo "::warning::${ahead} commit(s) were never pushed by the agent — rescuing"
          git rebase "$base" \
            || { git rebase --abort 2>/dev/null || true
                 echo "::error::rebase onto main conflicted; ${ahead} commit(s) left unpushed"; exit 0; }
          git push origin HEAD:main 2>&1 | tail -3 \
            || git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main 2>&1 | tail -3
