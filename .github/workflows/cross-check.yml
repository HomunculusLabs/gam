name: Compile gate (native Linux + non-Linux cross)

# THE push gate on main: does this commit compile, everywhere, with the
# repository's own bans enforced? Two jobs, because "compiles" has two halves
# that no single `cargo check` covers.
#
# NATIVE LINUX (#2582). Before this job existed, the only push-triggered Rust
# gate compiled for `x86_64-pc-windows-gnu`, so every
# `cfg(target_os = "linux")` neighbourhood — including the crates that take
# `cudarc` only on Linux — was compiled by nothing on push. The dispatch-only
# `test.yml` archive build is the workspace's real native compile, and it runs
# on a schedule at best. Meanwhile `cargo check -p <member-crate>`, which is how
# a lane verifies its own work, never runs the ROOT crate's `build.rs` and so
# has zero coverage of the ban scanner: `cc4a72e0c` landed a banned `let _`
# that way and broke every root-crate target — the entire 455-test quality
# suite came back BUILDFAIL instead of reporting model quality, and a 3h15m run
# was lost. This job is the answer to "is THIS commit buildable on the platform
# everyone runs it on", and it is minutes, not hours.
#
# The ban scanner runs FIRST, and standalone. It is the root `build.rs`, which
# is std-only and reads the tree through `CARGO_MANIFEST_DIR`, so `scripts/
# ban_scanner.sh` compiles and runs THE SAME CODE cargo runs — not a
# re-implementation of its rules — in about four seconds. That matters for the
# third defect #2582 names: as a build-script side effect the report is
# attributed to "failed to run custom build command for `gam`" and buried
# several hundred `cargo:rerun-if-changed=` lines from the `file:line` it
# names. Run directly, the violation list IS the step output. It also gives
# every lane a four-second pre-land check that a per-crate `cargo check` cannot
# provide.
#
# NON-LINUX CROSS (#2377). Every wheel platform except Linux was silently
# broken for three releases because no CI job COMPILES a non-Linux target
# between releases — `-D warnings` breaks in `cfg(target_os = "linux")`
# neighbourhoods (unused imports/variables on the non-Linux side of the cfg)
# only surfaced inside the release wheel matrix, whose failure skipped the
# upload while the run looked green.
#
# windows-gnu is deliberate: it exercises the not-linux side of every
# `cfg(target_os = "linux")` split with a toolchain that cross-installs on the
# ubuntu runner in seconds. `cargo check` needs no linker for rlib targets, so
# mingw is only needed for build scripts — installed anyway for safety.
# gam-pyffi is excluded from BOTH jobs: checking pyo3 for a foreign target
# needs a cross Python interpreter config, and its native surface is compiled
# on every push by the rolling-wheel workflow, which builds the extension
# module itself. Every `cfg(target_os)` neighbourhood that broke historically
# lives in the engine crates these jobs do cover.

on:
  push:
    branches:
      - main
    # Results commits (bench/gha_results/**) are data, not code: they are
    # pushed by the publish-gha-results action and must not re-trigger the
    # compile gate, which is already starved for runners (#2582).
    paths-ignore:
      - 'bench/gha_results/**'
  workflow_dispatch:

concurrency:
  # A per-commit verdict must be keyed on the COMMIT, not the branch (#2443).
  # Keyed on the ref, every push to main cancelled the previous run's verdict:
  # 28 of the last 40 runs died that way, 10 failed, and NONE succeeded -- so the
  # only push gate on main was structurally incapable of reporting anything. It
  # even correctly failed the commit that broke every build in the workspace
  # (4ad2a6bda); nobody could act on that, because a gate whose completions are
  # almost all `cancelled` carries no information when it says `failure`.
  #
  # Ref-keying with cancellation is right for "give me the newest answer about
  # this branch". It is wrong for "is THIS commit good?", because the verdict's
  # subject is the commit and superseding it destroys the only record of it.
  group: cross-check-${{ github.sha }}
  cancel-in-progress: false

jobs:
  linux-native-check:
    name: Native Linux — ban scanner + workspace --all-targets
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Ban scanner (root build.rs, run standalone)
        run: |
          set +e
          scripts/ban_scanner.sh .
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error title=Ban scanner::This commit contains banned constructs; every offending file:line is printed above in this step. The same check aborts the root crate's build, which fails EVERY root-crate target including the whole quality suite."
          fi
          exit "$status"
      - uses: mozilla-actions/sccache-action@v0.0.9
      - name: Check workspace natively (deny warnings)
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: sccache
          RUSTFLAGS: "-D warnings"
          CARGO_INCREMENTAL: "0"
        run: |
          # `--locked` on the NATIVE arm, and this is the arm that catches
          # lockfile drift, not a style preference.
          #
          # A plain `cargo check` RESOLVES and silently rewrites Cargo.lock when a
          # manifest gains a dependency edge, so it passes. `--locked` refuses
          # instead. Until now `--locked` appeared ONLY in `publish.yml` and
          # `pypi-wheels.yml` -- the release paths -- so a drifted lockfile cleared
          # every gate on every push and first failed at PUBLISH time, on a
          # different day, to a different person, with no obvious link back to the
          # commit that caused it.
          #
          # Measured: `1fa453556` added `gam-test-support` to
          # `crates/gam-cli/Cargo.toml` without a lock entry. Its author ran
          # `cargo check -p gam-linalg -p gam-cli -p gam-test-support
          # --all-targets` and got a clean exit -- necessary but not sufficient,
          # exactly because a bare check repairs the lock on the way past. It took
          # a follow-up commit (`dad51929c`) to notice.
          #
          # Only the native arm carries it: the two arms share one checkout, so a
          # single `--locked` proves the lock is complete, and putting it on both
          # would fail the cross-compile arm for a reason that has nothing to do
          # with the target it exists to check.
          cargo check --locked --workspace --exclude gam-pyffi --all-targets

  windows-gnu-check:
    name: Non-Linux cross (x86_64-pc-windows-gnu)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install mingw + Windows target
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64
          rustup target add x86_64-pc-windows-gnu
      - uses: mozilla-actions/sccache-action@v0.0.9
      - name: Cross-check workspace (deny warnings)
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: sccache
          RUSTFLAGS: "-D warnings"
          CARGO_INCREMENTAL: "0"
        run: |
          cargo check --workspace --exclude gam-pyffi --all-targets --target x86_64-pc-windows-gnu
