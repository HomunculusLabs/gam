name: Fuzz vs mgcv

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      log_level:
        description: "gamfit solver log level for this run (empty = quiet default). Use 'info' to make budget spend attributable per scenario; the stream is uploaded as an artifact and is NOT committed."
        default: ""
        required: false

# #2443/#2437: a fuzz run's value IS the corpus/findings it produced, so the
# scheduled run is keyed on `github.sha` and never cancelled — under ref-keying a
# lane `workflow_dispatch` from `main` shares the group and discards the night's
# fuzzing. Dispatched runs retain newest-wins semantics on their own ref.
concurrency:
  group: fuzz-${{ github.event_name == 'schedule' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

permissions:
  actions: read
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    permissions:
      contents: write
      actions: read
    name: Fuzz vs mgcv
    runs-on: ubuntu-latest
    # MUST exceed the trial budget below (`--max-total-seconds 3300` = 55 min)
    # PLUS setup: apt/R/mgcv install, pip deps, and the release wheel build,
    # which together run ~20-25 min on a cold hosted runner. At the previous
    # 60 the job was cancelled at exactly 60:00 on EVERY run — measured
    # 11:09:09 -> 12:09:24 on run 29684616297, and identically on the two runs
    # before it — so the scoreboard never finished and only the handful of
    # trials completed before the kill were ever uploaded. Keep this at least
    # `max-total-seconds/60 + 30`; the two constants are coupled and must move
    # together.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # #1458: full history so build.rs author gate resolves real last editor, not HEAD

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release -p gam-cli

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install --upgrade pip "maturin>=1.7,<2" numpy pandas pyarrow scikit-learn lifelines

      - name: Build and install gamfit (maturin)
        # `bench/fuzz_vs_mgcv.py` imports the project's own `gamfit` Python
        # package (`gamfit._binding.rust_module`) for its scoring helpers, so
        # the fuzzer aborts at `ModuleNotFoundError: No module named 'gamfit'`
        # unless the maturin-built wheel is installed alongside the CLI build
        # that powers `_ensure_rust_binary`. Build into `dist/` and install
        # the wheel directly so the fuzzer can `import gamfit`.
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          maturin build --release -i python3 -o dist
          pip install --force-reinstall dist/*.whl

      - name: Set up R
        uses: ./.github/actions/setup-bench-r
        with:
          r-version: "4.4.3"

      - name: Install R packages
        run: Rscript -e 'install.packages(c("mgcv","jsonlite"), repos="https://cloud.r-project.org", Ncpus=max(1L, parallel::detectCores()-1L))'

      - name: Run fuzzer
        env:
          LOG_LEVEL: ${{ github.event.inputs.log_level }}
        run: |
          set -o pipefail
          # #2584: stdout is the in-tree ledger (`fuzz_output.txt` is COMMITTED by
          # publish-gha-results, so it must stay small); stderr carries the solver
          # stream and goes to an artifact-only file. Raising the level globally
          # into the committed file would check in a six-figure-line log nightly.
          level_args=()
          if [[ -n "${LOG_LEVEL:-}" ]]; then
            level_args=(--log-level "$LOG_LEVEL")
          fi
          # The step shell is `bash -e`, so the pipeline must be un-guarded for
          # its exit code to be CAPTURED rather than abort the step: a failing
          # run is exactly when the stderr tail below is worth having in-tree.
          set +e
          python bench/fuzz_vs_mgcv.py \
            --n-trials 100 \
            --top 30 \
            --rust-timeout 60 \
            --r-timeout 60 \
            --max-scenario-cost 200000 \
            --max-total-seconds 3300 \
            "${level_args[@]}" \
            2> fuzz_solver.log | tee fuzz_output.txt
          status=${PIPESTATUS[0]}
          set -e
          # Keep the committed ledger small but never blind: a crash tail still
          # lands in-tree, while the full stream stays artifact-only.
          {
            echo
            echo "----- stderr tail (full stream: fuzz-results artifact, fuzz_solver.log) -----"
            tail -n 200 fuzz_solver.log || true
          } >> fuzz_output.txt
          exit "$status"

      - name: Upload fuzz results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-results
          path: |
            bench/fuzz_results.jsonl
            fuzz_output.txt
            fuzz_solver.log
          if-no-files-found: warn


      # Track this run's uncompressed numbers in-tree (bench/gha_results/fuzz).
      # always() so a failed or timed-out run still publishes what it measured -
      # those numbers are usually the interesting ones. Publishes nothing when the
      # run produced no results, so a bad run never blanks the last good one.
      - name: Publish results to bench/gha_results
        if: always()
        uses: ./.github/actions/publish-gha-results
        with:
          name: fuzz
          files: |
            bench/fuzz_results.jsonl
            fuzz_output.txt