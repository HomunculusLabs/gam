name: gha-run

# fastcheck's overflow (~/.local/bin/fastcheck) on a free runner of this public repository: a check,
# clippy or test build that would wait for a warm slot on the Mac (ubuntu-22.04, 4 CPUs, 16 GB RAM),
# and release builds of examples for the Mac (macos-15, Apple silicon, with sccache). COMMAND runs at
# commit SHA with OUT a directory uploaded as artifact NAME (7 days), which fastcheck downloads.
#
# The repository is public, and so are this workflow's logs and artifacts: commands and inputs come
# only from public sources (the commit and its diff), never keys, credentials or private data.
# Inputs reach the shell through the environment, never spliced into the script.

on:
  workflow_dispatch:
    inputs:
      name:
        description: "Run name: the artifact's name and the run's title"
        required: true
      sha:
        description: "Commit to run at (40 hex)"
        required: true
      command:
        description: "Shell command run at the commit"
        required: true
      cache:
        description: "Build cache kind: check, clippy or test for fastcheck's overflow; empty for release builds"
        default: ""
      os:
        description: "Runner: ubuntu-22.04 (default) or macos-15 (Apple silicon: fastcheck's release builds for the Mac)"
        default: ""

run-name: gha-run ${{ inputs.name }}

permissions:
  contents: read

jobs:
  run:
    runs-on: ${{ inputs.os != '' && inputs.os || 'ubuntu-22.04' }}
    timeout-minutes: 355
    env:
      COMMAND: ${{ inputs.command }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      # On macOS (fastcheck's release builds) sccache keeps every unchanged crate's objects across
      # commits, so a build recompiles only what the commit changed; the command sets RUSTC_WRAPPER.
      - uses: mozilla-actions/sccache-action@v0.0.9
        if: runner.os == 'macOS'

      - name: Toolchain (rust-toolchain.toml's)
        run: rustup toolchain install "$(sed -nE 's/^channel = "([^"]+)"/\1/p' rust-toolchain.toml)" --profile minimal

      # One entry per lock file, toolchain and kind of build (release; fastcheck's check, clippy and
      # test builds): the dependencies, which cost the build most, come from it; the workspace's own
      # crates rebuild from the commit. An entry per commit would evict the other workflows' caches
      # from the repository's 10 GB.
      # Saved (below) only when missing, and for check, clippy and test only by a run named
      # cache-KIND that builds the whole workspace's dependencies, so a narrow check never stores a
      # partial cache that every later check would then rebuild around.
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: gha-run-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}${{ inputs.cache != '' && format('-{0}', inputs.cache) || '' }}${{ runner.os == 'macOS' && '-macos' || '' }}

      - name: Command
        run: |
          mkdir -p out
          export OUT=$PWD/out
          bash -c "$COMMAND" 2>&1 | tee -a out/command.log
          exit "${PIPESTATUS[0]}"

      - uses: actions/cache/save@v4
        if: always() && steps.cache.outputs.cache-hit != 'true' && (inputs.cache == '' || startsWith(inputs.name, 'cache-'))
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: gha-run-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}${{ inputs.cache != '' && format('-{0}', inputs.cache) || '' }}${{ runner.os == 'macOS' && '-macos' || '' }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.name }}
          path: out/
          retention-days: 7
          if-no-files-found: ignore
