name: Nightly ledger guardian

# `schedule` delivery is best-effort: GitHub documents that scheduled events can
# be delayed or dropped under load. A single cron on the expensive workflow
# therefore cannot guarantee a daily MASTER_FAILURES ledger (#2437).
#
# This cheap controller gets several off-peak delivery opportunities. The
# opportunities are redundant, not retries: a serialized, UTC-date-keyed guard
# makes every event after the first accepted dispatch a no-op. The expensive
# workflow itself has no cron, so a delayed guardian event cannot race a delayed
# direct test.yml event into a second matrix.
on:
  schedule:
    # Distinct off-hour minutes reduce correlated scheduler load.
    - cron: "11 3 * * *"
    - cron: "29 4 * * *"
    - cron: "47 6 * * *"
  workflow_dispatch:
    inputs:
      observe_only:
        description: "Evaluate and report the guard without dispatching Rust CI."
        type: boolean
        default: true
        required: true

# Only one guard may decide at a time. Later scheduled events are redundant, so
# replacing a pending guard is harmless; the running guard is never cancelled.
concurrency:
  group: nightly-ledger-guardian
  cancel-in-progress: false

# The only mutation is one workflow_dispatch call after the guard proves the
# current UTC ledger is overdue.
permissions:
  actions: write

jobs:
  ensure-ledger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch one overdue ledger
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OBSERVE_ONLY: ${{ inputs.observe_only }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "::error::The nightly ledger guardian must run from the default branch."
            exit 1
          fi

          ledger_date=$(date -u +%F)
          day_start="${ledger_date}T00:00:00Z"
          ledger_title="Rust CI: nightly ledger ${ledger_date}"

          runs=$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/test.yml/runs?branch=${GITHUB_REF_NAME}&per_page=100"
          )

          # The UTC date is the idempotency key, but only an attempt that could
          # still MEASURE something may satisfy it. A cancelled run measured
          # nothing it can be held to, so counting it retires the day on the
          # strength of a run that produced no verdict.
          #
          # This guard used to match on the title alone, which made it strictly
          # weaker than the MASTER_FAILURES predicate further down and yet run
          # first. Measured on 2026-07-26: ledger run 30195751223 was title-
          # matched and cancelled with 7 of its 10 shards killed mid-flight, and
          # its own artifact reports `workspace shards: **NOT MEASURED**`. The
          # artifact predicate would have rejected it; the title check exited
          # before that predicate could be reached. A cheap approximation of a
          # precise test must not short-circuit the precise test.
          #
          # Replacing a cancelled attempt is not an unbounded retry loop:
          # `max_attempts` caps the day's dispatches explicitly, so the spend
          # bound holds no matter how many guardian events or manual dispatches
          # arrive. The cap is the thing that bounds spend; the idempotency key
          # is the thing that decides whether the day was measured. Conflating
          # them is what lost 2026-07-26.
          max_attempts=3

          same_date=$(
            jq --arg title "$ledger_title" \
              '[.workflow_runs[] | select(.display_title == $title)]' \
              <<< "$runs"
          )
          attempts=$(jq -r 'length' <<< "$same_date")

          # `.conclusion` is null while a run is queued or in progress, and null
          # is not "cancelled", so a live attempt still satisfies the key.
          existing=$(
            jq -r \
              '[.[] | select(.conclusion != "cancelled")][0]
               | if . then "\(.id)\t\(.status)\t\(.conclusion // "pending")\t\(.html_url)" else empty end' \
              <<< "$same_date"
          )
          if [[ -n "$existing" ]]; then
            IFS=$'\t' read -r run_id run_status run_conclusion run_url <<< "$existing"
            {
              echo "### No-op: today's ledger was already dispatched"
              echo
              echo "- UTC ledger date: \`${ledger_date}\`"
              echo "- run: [\`${run_id}\`](${run_url})"
              echo "- status: \`${run_status}\` / conclusion: \`${run_conclusion}\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Reaching here means every same-date attempt was cancelled, so
          # `attempts` is the cancelled count.
          if (( attempts >= max_attempts )); then
            {
              echo "### No-op: today's ledger attempts are exhausted"
              echo
              echo "- UTC ledger date: \`${ledger_date}\`"
              echo "- cancelled attempts: \`${attempts}\` (cap \`${max_attempts}\`)"
              echo
              echo "Every attempt was cancelled before it could measure the workspace"
              echo "shards. Dispatching again would spend another full matrix into the"
              echo "same control-plane cancellation (#2468), so the day is left"
              echo "explicitly unmeasured rather than retried without bound."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Never start a second full matrix while any main-branch Rust CI run is
          # active. A later guardian opportunity will decide again after it ends.
          active=$(
            jq -r \
              '[.workflow_runs[] | select(.status != "completed")][0]
               | if . then "\(.id)\t\(.status)\t\(.html_url)" else empty end' \
              <<< "$runs"
          )
          if [[ -n "$active" ]]; then
            IFS=$'\t' read -r run_id run_status run_url <<< "$active"
            {
              echo "### No-op: Rust CI is already active"
              echo
              echo "- run: [\`${run_id}\`](${run_url})"
              echo "- status: \`${run_status}\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # An interactive run completed today may already have produced the
          # authoritative ledger. Count it only when the artifact exists and
          # every surface is measured; an honest-null MASTER_FAILURES artifact
          # from a cancelled/early-failed run does not satisfy this predicate.
          mapfile -t recent_ids < <(
            jq -r --arg since "$day_start" \
              '.workflow_runs[]
               | select(
                   .status == "completed"
                   and .created_at >= $since
                   and (
                     .conclusion == "success"
                     or .conclusion == "failure"
                   )
                 )
               | .id' \
              <<< "$runs"
          )
          artifact_root=$(mktemp -d)
          trap 'rm -rf "$artifact_root"' EXIT
          for run_id in "${recent_ids[@]}"; do
            artifacts=$(
              gh api \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2026-03-10" \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100"
            )
            artifact_id=$(
              jq -r \
                '[.artifacts[]
                  | select(.name == "MASTER_FAILURES" and (.expired | not))][0].id
                 // empty' \
                <<< "$artifacts"
            )
            if [[ -z "$artifact_id" ]]; then
              continue
            fi

            artifact_zip="${artifact_root}/${run_id}.zip"
            artifact_md="${artifact_root}/${run_id}.md"
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
              > "$artifact_zip"
            if ! unzip -p "$artifact_zip" MASTER_FAILURES.md > "$artifact_md"; then
              continue
            fi
            if [[ -s "$artifact_md" ]] \
              && ! grep -Eq \
                '^- (workspace shards|gam-pyffi unit tests|Python API tests): \*\*NOT MEASURED\*\*' \
                "$artifact_md"
            then
              run_url=$(
                jq -r --argjson id "$run_id" \
                  '.workflow_runs[] | select(.id == $id) | .html_url' \
                  <<< "$runs"
              )
              {
                echo "### No-op: today's ledger already exists"
                echo
                echo "- UTC ledger date: \`${ledger_date}\`"
                echo "- measured run: [\`${run_id}\`](${run_url})"
                echo "- artifact: \`MASTER_FAILURES\`"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done

          if [[ "$OBSERVE_ONLY" == "true" ]]; then
            {
              echo "### Observe only: today's ledger is overdue"
              echo
              echo "No active Rust CI run, same-date ledger dispatch, or"
              echo "same-date \`MASTER_FAILURES\` artifact was found."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # API version 2026-03-10 returns the created run ID synchronously.
          # Recording that ID establishes ownership; this workflow never calls
          # the cancellation endpoint, even for the run it creates.
          dispatch=$(
            gh api --method POST \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/test.yml/dispatches" \
              -f ref="$GITHUB_REF_NAME" \
              -f "inputs[ledger_date]=${ledger_date}"
          )
          run_id=$(jq -er '.workflow_run_id' <<< "$dispatch")
          run_url=$(jq -er '.html_url' <<< "$dispatch")
          {
            echo "### Dispatched today's overdue ledger"
            echo
            echo "- UTC ledger date: \`${ledger_date}\`"
            echo "- owned run: [\`${run_id}\`](${run_url})"
            echo
            echo "The synchronous run ID is the idempotency evidence for later guardian events."
          } >> "$GITHUB_STEP_SUMMARY"
