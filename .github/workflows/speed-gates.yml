name: Speed Gates

# The #932 contract -- every compiled (Taylor-jet) row lowering that ships must
# be at least as fast as the strongest hand path or generic tower it replaced
# -- is asserted by wall-clock gates that only MEASURE anything in the release
# profile: `[profile.test.package.gam-models]` splits codegen into 16 units with
# no LTO, while the shipped profile is one unit plus thin-LTO, and the whole
# margin of a compiled-vs-hand row kernel can be cross-CGU inlining. Until this
# workflow existed, `cargo test --release` ran in NO workflow, so those gates
# were never executed by CI: they were not failing, they were not running.
#
# Two things make this lane fail-closed rather than name-matched:
#
#   * The population is DERIVED. `scripts/speed_gates.py` walks the crates for
#     every `#[test]` whose body opens a `gam_math::paired_timing::SpeedGate`,
#     resolves each to an exact test path in the compiled release binary, runs
#     each alone, and refuses success unless every derived gate executed and
#     printed a cell verdict. A name-prefix filter found 5 of 13 gates the
#     last time anyone counted; a derivation cannot miss one.
#   * The matrix is derived too. The `derive` job lists the packages that
#     carry gates and the `gates` job fans out over exactly those, so a gate
#     added in a crate this file has never heard of is still run.

on:
  push:
    branches: [main]
    # Per-push runs are scoped to the files that change WHAT THE GATES MEASURE:
    # the two jet compilers, the jet algebra, the harness and the runner.
    # `main` receives a push every minute or two, and a run whose release build
    # is still waiting for a runner is "pending" and is replaced by the next
    # push, so a per-push trigger on every crate never produced a verdict at
    # all (measured: every run of this lane's first hour was cancelled while
    # queued). The nightly run below covers every family kernel regardless of
    # which file moved.
    paths:
      - "crates/gam-row-macros/**"
      - "crates/gam-math/src/paired_timing.rs"
      - "crates/gam-math/src/jet_*.rs"
      - "crates/gam-math/src/fast_channel.rs"
      - "crates/gam-math/src/nested_dual.rs"
      # The family lowerings the gates measure, and the gates themselves: a
      # change to a row program, an atom, a jet channel consumer or a hand
      # opponent runs its package's gates on the push that lands it, not on
      # the next nightly (#932).
      - "crates/gam-models/src/bms/**"
      - "crates/gam-models/src/gamlss/**"
      - "crates/gam-models/src/survival/**"
      - "crates/gam-models/src/timepoint_exact/**"
      - "crates/gam-models/src/multinomial_reml.rs"
      - "crates/gam-models/src/row_math.rs"
      - "crates/gam-models/src/tests.rs"
      - "crates/gam-sae/src/manifold/**"
      - "scripts/speed_gates.py"
      - ".github/workflows/speed-gates.yml"
      - ".github/actions/setup-rust-ci/**"
  schedule:
    # Nightly, so a host-image or toolchain change that moves a fine margin is
    # seen within a day even when nothing in the tree changed, and so every
    # family kernel is measured daily whichever file moved.
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      disassemble:
        description: >-
          Regex over symbol names; the matching functions of every built test
          binary are disassembled into the job log after the gates run (a
          host-side diagnostic: verdicts differ by core, and the release
          assembly on THIS runner is what explains them).
        required: false
        default: ""

# Let a running build FINISH. `main` receives a push every minute or two, and
# a release build of the gam-models test target takes tens of minutes; with
# cancel-in-progress the first four runs of this lane were all cancelled by
# the next push and no verdict was ever produced. Without it GitHub keeps at
# most one PENDING run per group (the newest push replaces older pending
# ones) while the in-progress run completes, so every completed run is a
# verdict on a tree at most one build behind the tip.
concurrency:
  group: speed-gates-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"
  RUSTFLAGS: "-C link-arg=-Wl,--threads=1"

jobs:
  derive:
    name: Derive the gate population
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      packages: ${{ steps.derive.outputs.packages }}
    steps:
      - uses: actions/checkout@v7
      - name: Derive gates from SpeedGate::open call sites
        id: derive
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/speed_gates.py
          packages=$(python3 scripts/speed_gates.py --packages-json)
          echo "packages=${packages}" >> "$GITHUB_OUTPUT"
          echo "packages carrying speed gates: ${packages}"

  gates:
    name: Speed gates (${{ matrix.package }})
    needs: derive
    runs-on: ubuntu-latest
    # The release test target of gam-models is a thin-LTO, single-CGU build;
    # the focused proof lane budgets 3000s for it. The gates themselves take
    # a few minutes. This cap only has to stay clear of both.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.derive.outputs.packages) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # build.rs's human-author gate needs real history.
          fetch-depth: 0

      - name: Set up warm Rust toolchain
        uses: ./.github/actions/setup-rust-ci
        with:
          free-disk-space: "false"
          cache-targets: "false"

      - name: Record execution host and compiler
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          nproc
          # Identical-work cells are ordered by the core's scheduling, so the
          # CPU model belongs next to every verdict this job prints.
          lscpu | grep -E "^Model name|^L2|^L3" | sed 's/ \+/ /g'
          rustc -vV

      - name: Build and run every derived gate in the release profile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p speed-gate-logs
          python3 scripts/speed_gates.py --run --package "${{ matrix.package }}" \
            --summary "$GITHUB_STEP_SUMMARY" 2>&1 | tee "speed-gate-logs/${{ matrix.package }}.log"
          exit "${PIPESTATUS[0]}"

      - name: Disassemble the requested symbols on this runner
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.disassemble != '' }}
        shell: bash
        env:
          PATTERN: ${{ inputs.disassemble }}
        run: |
          set -euo pipefail
          for binary in $(find target/release/deps -maxdepth 1 -type f -perm -u+x ! -name '*.so' ! -name '*.d'); do
            for symbol in $(nm "$binary" 2>/dev/null | awk '$2 ~ /^[tT]$/ {print $3}' | grep -E "$PATTERN" | head -20); do
              echo "##### $(basename "$binary") :: $symbol"
              objdump -d -M intel --no-show-raw-insn --disassemble="$symbol" "$binary" \
                | grep -v 'int3' | sed 's/^ *[0-9a-f]*:\s*//' | head -3000
            done
          done

      - name: Report compiler-cache evidence
        if: ${{ always() }}
        shell: bash
        run: sccache --show-stats || true

      - name: Upload gate logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: speed-gates-${{ matrix.package }}-${{ github.run_id }}
          path: speed-gate-logs
          if-no-files-found: ignore
