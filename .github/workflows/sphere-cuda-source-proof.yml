name: Sphere CUDA source proof

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact 40-character source commit to compile
        required: true
        type: string
        default: ff9c0e1ee731e3806bcac3167532708df1864dcd

permissions:
  contents: read

jobs:
  ptx:
    name: Emit sphere-kernel PTX
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    container:
      image: nvidia/cuda:12.2.2-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1

      - name: Require an immutable source commit
        shell: bash
        env:
          REQUESTED_SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          if [[ ! "${REQUESTED_SOURCE_REF}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source_ref must be an exact lowercase 40-character commit."
            exit 1
          fi
          resolved=$(tr -d '\r\n' < .git/HEAD)
          if [[ "${resolved}" != "${REQUESTED_SOURCE_REF}" ]]; then
            echo "::error::Checkout resolved to ${resolved}, not ${REQUESTED_SOURCE_REF}."
            exit 1
          fi

      - name: Extract embedded CUDA and emit PTX
        shell: bash
        run: |
          set -euo pipefail
          source_file=crates/gam-terms/src/basis/sphere_gpu.rs
          {
            echo '#define LMAX 20'
            awk '
              /const KERNEL_TEMPLATE: &str = r#"/ { capture = 1; next }
              capture && /^"#;/ { exit }
              capture { print }
            ' "${source_file}"
          } > sphere-kernels.cu

          nvcc             --std=c++17             --gpu-architecture=compute_70             --ptx             sphere-kernels.cu             --output-file sphere-kernels.ptx

          test -s sphere-kernels.ptx
          grep -q '\.entry s2_wahba_legendre_colmajor' sphere-kernels.ptx
          grep -q '\.entry s2_wahba_householder_constrained_colmajor' sphere-kernels.ptx
          if grep -q 'fma(xi, cxj' sphere-kernels.cu; then
            echo "::error::A lossy geodesic dot-product site survived in the emitted CUDA source."
            exit 1
          fi
          grep -q 's2_chord_cos_gamma' sphere-kernels.cu
          wc -c sphere-kernels.cu sphere-kernels.ptx
          nvcc --version

      - uses: actions/upload-artifact@v4
        with:
          name: sphere-kernels-ptx-${{ inputs.source_ref }}
          path: sphere-kernels.ptx
          if-no-files-found: error
          retention-days: 7