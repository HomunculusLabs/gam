name: Rolling wheel (warm-start artifact)

# Permanent warm-start: pushes to main keep the x86_64 manylinux wheel plus CLI
# pinned to the rolling `wheel-latest` prerelease. Exact-SHA consumers can also
# commission one immutable runtime without publishing over that rolling channel.
# Compute boxes and validation workflows download one verified runtime in seconds
# instead of paying a cold cargo build:
#
#   gh release download wheel-latest --repo SauersML/gam -p 'gamfit-*.whl' -D dist/
#   pip install --force-reinstall dist/gamfit-*.whl
#
# The wheel is built in a manylinux_2_28 container so it runs on MSI's Rocky 8
# (glibc 2.28) as well as modern cloud images — a plain ubuntu-runner build
# would tag manylinux_2_35 and refuse to install on the cluster. sccache keeps
# rebuilds warm across runs. `concurrency` cancels superseded rolling builds so
# only the newest push spends minutes; commissioned exact-SHA builds are never
# cancelled by another lane.
#
# This channel NEVER publishes to PyPI — pypi-wheels.yml stays the version-gated
# release path; this is the fleet's iteration artifact. It builds under the
# iteration profile (LTO off, CGU 16: 2-4x faster rebuilds for ~10% runtime),
# so use it for correctness/quality/acceptance work — NOT for wall-clock perf
# measurements, which need a real release-profile build.

on:
  push:
    branches: [main]
    # Results commits (bench/gha_results/**) are data, not code: they are
    # pushed by the publish-gha-results action and must not re-trigger the
    # compile gate, which is already starved for runners (#2582).
    paths-ignore:
      - 'bench/gha_results/**'
  # A periodic build that pushes CANNOT cancel.
  #
  # The push lane below deliberately cancels superseded builds, on the premise
  # recorded under concurrency: main has one newest-writer lane, so only the
  # newest push should spend minutes. That premise no longer holds. Measured
  # 2026-07-30: pushes to main arrive every 1-3 minutes from a multi-lane fleet
  # while a manylinux build takes far longer, so EVERY automatic build is
  # superseded before it finishes -- 19 of the last 20 runs cancelled, zero
  # successes. A rolling artifact that never rolls is worse than a slow one: the
  # Python suites, whose only runtime is this wheel, had then gone unmeasured for
  # over a week -- see gam#2616 and gam#2432.
  #
  # Scheduled runs land in a DIFFERENT concurrency group from pushes: push uses
  # the literal runtime-main, while everything else falls through to the
  # ref-keyed group. So a push can no longer kill one. That keeps the cheap
  # rolling behaviour for rapid pushes and still guarantees an artifact exists
  # on a bounded delay.
  schedule:
    - cron: '19 4 * * *'
  workflow_dispatch:
    inputs:
      build_sha:
        description: "Exact lowercase 40-character commit to build. Empty = dispatch SHA."
        type: string
        default: ""
        required: false

# Push builds are cancelled when superseded. NOTE the premise this rests on --
# that main has one newest-writer lane -- is FALSE under the current fleet, which
# is why the schedule above exists: it is the lane that actually produces
# artifacts, and pushes cannot cancel it because it keys a different group.
# A commissioned build is keyed by the exact commit it promises and is never
# cancelled. An ordinary empty-input dispatch keeps the existing ref-keyed lane.
concurrency:
  group: runtime-${{ github.event_name == 'push' && 'main' || github.event.inputs.build_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event.inputs.build_sha == '' }}

permissions:
  contents: write

jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the exact commit to build
        id: target
        shell: bash
        env:
          # `github` exists on every event; a missing nested property evaluates
          # to the empty string on push. The `inputs` context itself is only
          # available to workflow_dispatch/workflow_call runs.
          REQUESTED_SHA: ${{ github.event.inputs.build_sha }}
        run: |
          set -euo pipefail
          target_sha="${REQUESTED_SHA:-$GITHUB_SHA}"
          if [[ ! "$target_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::build_sha must be one full lowercase 40-character commit SHA; got '${target_sha}'."
            exit 1
          fi
          printf 'sha=%s\n' "$target_sha" >> "$GITHUB_OUTPUT"
          echo "Building immutable runtime ${target_sha}."

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}
          # build.rs consults git history (author guard / SPEC HEAD-diff check);
          # a shallow clone with depth 2 keeps a parent commit available.
          fetch-depth: 2

      - name: Build manylinux_2_28 x86_64 wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --strip -o dist -i python3.10
          manylinux: 2_28
          sccache: true
          # build.rs queries git history (author guard); inside the manylinux
          # container the repo is owned by the runner uid while git runs as
          # root, so git refuses with "dubious ownership" unless marked safe.
          before-script-linux: |
            git config --global --add safe.directory "$(pwd)"
            # maturin-action configures the GHA sccache backend before entering
            # the container but normally installs the executable only AFTER
            # this hook. Install it now so the CLI pre-build gets the same warm
            # compiler cache as the wheel; both still share one target tree.
            uv tool install "sccache>=0.10.0"
            cargo build --release -p gam-cli
            mkdir -p dist
            cp target/release/gam dist/gam
        env:
          # Iteration profile — same knobs as the MSI warm builder: 2-4x faster
          # rebuilds for ~10% runtime. Numerics are unaffected.
          CARGO_PROFILE_RELEASE_LTO: "off"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

      - name: Seal exact runtime provenance
        shell: bash
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          WHEEL=$(ls dist/gamfit-*.whl)
          test -x dist/gam
          {
            echo "commit=${TARGET_SHA}"
            (cd dist && sha256sum "$(basename "$WHEEL")" gam)
          } > dist/RUNTIME_PROVENANCE.txt

      - name: Pin newest main runtime to rolling release
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event.inputs.build_sha == '') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          WHEEL=$(ls dist/gamfit-*.whl)
          gh release view wheel-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create wheel-latest --repo "$GITHUB_REPOSITORY" --prerelease \
              --title "Rolling main wheel" \
              --notes "Continuously replaced by the newest green-main build. Not a versioned release."
          gh release upload wheel-latest "$WHEEL" dist/gam --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload wheel-latest dist/RUNTIME_PROVENANCE.txt --repo "$GITHUB_REPOSITORY" --clobber

      - name: Also keep it as a run artifact
        uses: actions/upload-artifact@v4
        with:
          name: gamfit-runtime-${{ steps.target.outputs.sha }}
          path: |
            dist/gamfit-*.whl
            dist/gam
            dist/RUNTIME_PROVENANCE.txt
          retention-days: 14
