[package]
name = "gam-point-process"
version = "0.3.153"
edition = "2024"
description = "Finite-state marked point processes with exact Matérn dynamics"
license = "AGPL-3.0-or-later"
repository = "https://github.com/SauersML/gam"
rust-version = "1.97"

[lints.rust]
warnings = "deny"

[dependencies]
ndarray = { version = "0.17.2", features = ["serde"] }
rand = "0.10.1"
rand_distr = "0.6.0"
serde = { version = "1.0.228", features = ["derive"] }
statrs = "0.19.0"
thiserror = "2.0.18"

[dev-dependencies]
approx = "0.5.1"
